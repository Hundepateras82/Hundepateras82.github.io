  /*
   * 54 piezas regionales + 6 armas únicas de jefe.
   * Cada pieza tiene identidad de catálogo y cada objeto una instancia.
   */
  REGIONS.forEach(region => {
    for (let quality = 0; quality < 3; quality++) {
      const rarity = ["common", "rare", "epic"][quality];
      const suffix = ["", " refinada", " ancestral"][quality];

      for (const slot of ["weapon", "armor", "charm"]) {
        const id = `${slot}-${region.id}-${quality}`;
        const names = {
          weapon: weaponNames,
          armor: armorNames,
          charm: charmNames
        };

        ITEMS[id] = {
          id,
          slot,
          region: region.id,
          name: names[slot][region.id - 1] + suffix,
          icon: slot === "weapon" ? "⚔️" : slot === "armor" ? "🛡️" : "🧿",
          rarity,
          quality,
          attack: slot === "weapon" ? 3 + region.id * 3 + quality * 4 : 0,
          defense: slot === "armor" ? 1 + region.id * 2 + quality * 2 : 0,
          hp: slot === "armor" ? 5 + region.id * 5 + quality * 8 : 0,
          crit: slot === "charm" ? 2 + quality * 2 : 0,
          mana: slot === "charm" ? 1 + quality : 0
        };
      }
    }

    const id = `boss-${region.id}`;
    ITEMS[id] = {
      id,
      slot: "weapon",
      region: region.id,
      name: [
        "Rama del Primer Sol",
        "Martillo de las Profundidades",
        "Canto del Oráculo",
        "Último Juramento",
        "Colmillo de Aurora",
        "Corona del Amanecer"
      ][region.id - 1],
      icon: ["🌳", "🔨", "🌀", "⚔️", "❄️", "🌅"][region.id - 1],
      rarity: "legendary",
      quality: 3,
      attack: 8 + region.id * 4,
      defense: 0,
      hp: 0,
      crit: 2,
      mana: 0
    };
  });

  const game = () => A.state.game;
  const talent = id => Number(game().talents[id]) || 0;

  function prepareGame() {
    const g = game();

    g.cleared ||= {};
    g.bossRewards ||= {};
    g.itemCodex ||= {};
    g.runCounter ||= 0;
    g.pendingLoot ||= null;
    g.materials ||= {};
    g.inventory ||= [];
    g.equipment ||= { weapon: null, armor: null, charm: null };
    g.collection ||= {};
    g.talents ||= {};

    for (const region of REGIONS) {
      g.materials[region.material] ||= 0;
    }
  }

  prepareGame();

  function regionFor(stage) {
    return REGIONS[Math.min(5, Math.floor((stage - 1) / 5))];
  }

  function stageUnlocked(stage) {
    return stage === 1 || !!game().cleared[stage - 1];
  }

  function frontier() {
    let stage = 1;
    while (stage <= 30 && game().cleared[stage]) stage++;
    return Math.min(30, stage);
  }

  function instance(id) {
    return game().inventory.find(item => item.id === id);
  }

  function definition(item) {
    return item ? ITEMS[item.defId] : null;
  }

  function itemStats(item) {
    const def = definition(item);
    if (!def) {
      return { attack: 0, defense: 0, hp: 0, crit: 0, mana: 0 };
    }

    const level = Number(item.level) || 0;

    return {
      attack: def.attack ? def.attack + level * 2 : 0,
      defense: def.defense ? def.defense + level : 0,
      hp: def.hp ? def.hp + level * 5 : 0,
      crit: def.crit ? def.crit + level : 0,
      mana: def.mana
    };
  }

  function heroStats() {
    prepareGame();

    const level = A.state.hero.level;
    const stats = {
      attack: 10 + level * 2 + talent("power") * 2,
      defense: 2 + Math.floor(level / 3) + talent("guard"),
      hp: 70 + level * 5 + talent("vitality") * 10,
      crit: 5 + talent("precision") * 2,
      mana: 5 + talent("wisdom"),
      heal: 22 + level * 2
    };

    for (const id of Object.values(game().equipment)) {
      const bonus = itemStats(instance(id));
      for (const key of ["attack", "defense", "hp", "crit", "mana"]) {
        stats[key] += bonus[key];
      }
    }

    stats.crit = Math.min(35, stats.crit);
    return stats;
  }

  function addItem(defId) {
    if (!ITEMS[defId]) throw new Error("Objeto desconocido.");

    const id = window.crypto?.randomUUID
      ? crypto.randomUUID()
      : `item-${Date.now()}-${Math.random().toString(36).slice(2)}`;

    const item = { id, defId, level: 0, acquiredAt: Date.now() };
    game().inventory.push(item);
    game().itemCodex[defId] = true;
    return item;
  }

  function addLog(battle, text) {
    battle.log.push(text);
    if (battle.log.length > 14) battle.log.shift();
  }

  function makeEnemy(stage, room) {
    const region = regionFor(stage);
    const boss = stage % 5 === 0 && room === 2;
    const source = boss ? region.boss : pick(region.enemies);

    return {
      id: `${region.id}-${source[0]}`,
      name: source[2],
      icon: source[1],
      boss,
      hp: Math.round((24 + stage * 4 + room * 5) * (boss ? 1.4 : 1)),
      maxHp: Math.round((24 + stage * 4 + room * 5) * (boss ? 1.4 : 1)),
      attack: Math.round((5 + stage * 1.1 + room) * (boss ? 1.12 : 1)),
      defense: Math.floor(stage / 5),
      turn: 1
    };
  }

  function expeditionBlocked() {
    return !!game().battle || !!game().pendingLoot;
  }

  function startExpedition(stage) {
    prepareGame();

    if (!Number.isInteger(stage) || stage < 1 || stage > 30) return;
    if (!stageUnlocked(stage)) {
      A.toast("Completa la ruta anterior para desbloquear esta.");
      return;
    }
    if (expeditionBlocked()) {
      A.toast("Termina la expedición o recoge tu cofre pendiente.");
      return;
    }
    if (game().energy < 1) {
      A.toast("No tienes energía. La reserva diaria se renueva sin entrenar extra.");
      return;
    }

    const stats = heroStats();
    game().energy--;
    game().runCounter++;

    game().battle = {
      id: `run-${game().runCounter}`,
      stage,
      room: 0,
      phase: "combat",
      stats,
      hp: stats.hp,
      maxHp: stats.hp,
      mana: stats.mana,
      maxMana: stats.mana,
      potions: 2,
      enemy: makeEnemy(stage, 0),
      log: ["Tu expedición comienza. Observa la intención del enemigo."],
      cooldown: 0,
      guard: false,
      victories: 0
    };

    A.state.ui.page = "adventure";
    A.state.ui.subpage.adventure = "expedition";
    A.save();
    A.sound("click");
    A.render();
  }

  function enemyIntent(enemy) {
    return enemy.turn % 3 === 0
      ? "Ataque fuerte: prepárate para defender."
      : "Ataque normal.";
  }

  function enemyTurn(battle) {
    const enemy = battle.enemy;
    const heavy = enemy.turn % 3 === 0;
    const raw = Math.round(enemy.attack * (heavy ? 1.7 : 1));
    let damage = Math.max(1, raw - battle.stats.defense);

    if (battle.guard) damage = Math.max(1, Math.round(damage * .35));

    battle.hp = Math.max(0, battle.hp - damage);

    addLog(
      battle,
      `${enemy.name} ${heavy ? "golpea con fuerza" : "ataca"}: ${damage} de daño.`
    );

    battle.guard = false;
    enemy.turn++;

    if (battle.hp <= 0) {
      battle.phase = "defeat";
      addLog(battle, "La expedición termina. Tu equipo y tu progreso siguen intactos.");
    }
  }

  function attackEnemy(battle, multiplier = 1) {
    const critical = random(1, 100) <= battle.stats.crit;
    const variance = random(90, 110) / 100;

    const damage = Math.max(
      1,
      Math.round(
        battle.stats.attack * multiplier * variance *
        (critical ? 1.6 : 1) - battle.enemy.defense
      )
    );

    battle.enemy.hp = Math.max(0, battle.enemy.hp - damage);

    addLog(
      battle,
      `${critical ? "¡Crítico! " : ""}Tu golpe causa ${damage} de daño.`
    );
    A.sound("hit");
  }

  function enemyDefeated(battle) {
    const enemy = battle.enemy;
    game().collection[enemy.id] = (game().collection[enemy.id] || 0) + 1;
    battle.victories++;

    addLog(battle, `${enemy.name} ha sido derrotado.`);
    battle.mana = Math.min(battle.maxMana, battle.mana + 1);
    battle.cooldown = 0;

    if (battle.room >= 2) {
      finishExpedition(battle);
      return;
    }

    battle.phase = battle.room === 0 ? "event" : "between";
  }

  function combatAction(move) {
    const battle = game().battle;
    if (!battle || battle.phase !== "combat") return;

    /*
     * No hay espera artificial.
     * Cada pulsación válida resuelve un turno completo.
     */
    if (move === "skill") {
      if (battle.cooldown > 0 || battle.mana < 3) {
        A.toast("La habilidad necesita 3 maná y estar disponible.");
        return;
      }
      battle.mana -= 3;
      battle.cooldown = 3;
      attackEnemy(battle, 1.85);
      addLog(battle, "Usas Corte del Alba.");
    } else if (move === "guard") {
      battle.guard = true;
      battle.mana = Math.min(battle.maxMana, battle.mana + 1);
      addLog(battle, "Te defiendes y recuperas 1 maná.");
    } else if (move === "potion") {
      if (battle.potions < 1 || battle.hp >= battle.maxHp) {
        A.toast("No necesitas una poción o no te quedan.");
        return;
      }

      battle.potions--;
      const before = battle.hp;
      battle.hp = Math.min(
        battle.maxHp,
        battle.hp + battle.stats.heal
      );
      addLog(battle, `La poción restaura ${battle.hp - before} de vida.`);
    } else if (move === "attack") {
      attackEnemy(battle);
    } else {
      return;
    }

    if (move !== "skill" && battle.cooldown > 0) battle.cooldown--;

    if (battle.enemy.hp <= 0) {
      enemyDefeated(battle);
    } else {
      enemyTurn(battle);
    }

    A.save();
    A.render();
  }

  function nextEncounter() {
    const battle = game().battle;
    if (!battle || battle.phase !== "between") return;

    battle.room++;
    battle.enemy = makeEnemy(battle.stage, battle.room);
    battle.phase = "combat";
    battle.guard = false;
    battle.cooldown = 0;

    addLog(battle, `Encuentro ${battle.room + 1}: ${battle.enemy.name}.`);
    A.save();
    A.render();
  }

  function eventChoice(choice) {
    const battle = game().battle;
    if (!battle || battle.phase !== "event") return;

    const region = regionFor(battle.stage);
    battle.eventBonus ||= { gold: 0, material: 0 };

    if (choice === "spring") {
      const healing = Math.round(battle.maxHp * .25);
      battle.hp = Math.min(battle.maxHp, battle.hp + healing);
      battle.mana = Math.min(battle.maxMana, battle.mana + 2);
      addLog(battle, "Encuentras una fuente: recuperas vida y 2 maná.");
    } else if (choice === "ruins") {
      battle.eventBonus.material += 2;
      addLog(battle, `Exploras las ruinas y encuentras 2 ${region.materialName}.`);
    } else if (choice === "risk") {
      if (random(1, 100) <= 65) {
        battle.eventBonus.gold += 45 + battle.stage * 5;
        battle.eventBonus.material += 1;
        addLog(battle, "Abres el cofre abandonado: el riesgo sale bien.");
      } else {
        const damage = Math.max(1, Math.round(battle.maxHp * .12));
        battle.hp = Math.max(1, battle.hp - damage);
        addLog(battle, `Era una trampa: pierdes ${damage} de vida, pero sobrevives.`);
      }
    } else {
      return;
    }

    battle.phase = "between";
    A.save();
    A.sound("click");
    A.render();
  }

  function rollRarity(isBoss) {
    const roll = random(1, 100);
    const luck = Math.min(12, talent("fortune") * 2);

    if (roll <= 5 + luck + (isBoss ? 5 : 0)) return "epic";
    if (roll <= 35 + luck + (isBoss ? 10 : 0)) return "rare";
    return "common";
  }

  function finishExpedition(battle) {
    const region = regionFor(battle.stage);
    const firstClear = !game().cleared[battle.stage];
    const bossRoute = battle.stage % 5 === 0;
    const uniqueBossItem =
      bossRoute && !game().bossRewards[region.id];

    const rarity = uniqueBossItem ? "legendary" : rollRarity(bossRoute);
    const quality = rarity === "epic" ? 2 : rarity === "rare" ? 1 : 0;
    const slot = pick(["weapon", "armor", "charm"]);

    const itemDef = uniqueBossItem
      ? `boss-${region.id}`
      : `${slot}-${region.id}-${quality}`;

    const bonus = battle.eventBonus || { gold: 0, material: 0 };

    /*
     * Se almacena el resultado antes de mostrarlo.
     * Recargar no vuelve a sortear el cofre.
     */
    game().pendingLoot = {
      id: `loot-${battle.id}`,
      stage: battle.stage,
      region: region.id,
      firstClear,
      bossRoute,
      uniqueBossItem,
      rarity,
      itemDef,
      xp: (firstClear ? 70 : 30) + battle.stage * 3,
      gold: 40 + battle.stage * 7 + bonus.gold,
      crystals: firstClear ? bossRoute ? 12 : 4 : 0,
      material: 2 + (bossRoute ? 2 : 0) + bonus.material
    };

    game().battle = null;
    A.save();
    A.sound("victory");
  }

  function collectLoot() {
    const loot = game().pendingLoot;
    if (!loot) return;

    const region = REGIONS[loot.region - 1];

    /*
     * El marcador impide duplicar el objeto y los materiales.
     * Se elimina el cofre antes de guardar la transacción completa.
     */
    if (!game().milestones[loot.id]) {
      game().milestones[loot.id] = true;
      addItem(loot.itemDef);

      game().materials[region.material] += loot.material;
      game().cleared[loot.stage] = true;

      if (loot.uniqueBossItem) {
        game().bossRewards[loot.region] = true;
      }

      game().openedChests++;
      game().stage = frontier();
      game().chapter = regionFor(frontier()).id;
    }

    game().pendingLoot = null;

    A.reward(
      loot.id,
      { xp: loot.xp, gold: loot.gold, crystals: loot.crystals },
      "Botín de la expedición"
    );

    A.save();
    A.render();
  }

  function abandonExpedition() {
    if (!game().battle) return;

    A.modal(
      "Terminar expedición",
      `<p>Conservarás tu equipo y todo el progreso anterior.</p>
       <p class="muted smalltext">
         La energía usada al entrar no se devuelve.
         No tendrás que hacer ejercicio para recuperarla.
       </p>
       ${B("Terminar esta expedición", "confirm-abandon", {}, "danger full")}`
    );
  }

  function itemLabel(item) {
    const def = definition(item);
    if (!def) return "Objeto desconocido";
    return `${def.name}${item.level ? ` +${item.level}` : ""}`;
  }

  function statText(item) {
    const stats = itemStats(item);
    return [
      stats.attack ? `ATQ +${stats.attack}` : "",
      stats.defense ? `DEF +${stats.defense}` : "",
      stats.hp ? `Vida +${stats.hp}` : "",
      stats.crit ? `Crítico +${stats.crit}%` : "",
      stats.mana ? `Maná +${stats.mana}` : ""
    ].filter(Boolean).join(" · ");
  }

  function upgradeCost(item) {
    const def = definition(item);
    const next = (item.level || 0) + 1;

    return {
      gold: 45 * next * def.region,
      material: next + 1,
      materialId: REGIONS[def.region - 1].material
    };
  }

  function equipItem(id) {
    if (game().battle) {
      A.toast("Cambia de equipo entre expediciones.");
      return;
    }

    const item = instance(id);
    const def = definition(item);
    if (!def) return;

    game().equipment[def.slot] =
      game().equipment[def.slot] === id ? null : id;

    A.save();
    A.sound("click");
    A.render();
  }

  function upgradeItem(id) {
    if (game().battle) {
      A.toast("Mejora tu equipo entre expediciones.");
      return;
    }

    const item = instance(id);
    if (!item || item.level >= 5) return;

    const cost = upgradeCost(item);

    if (
      A.state.hero.gold < cost.gold ||
      game().materials[cost.materialId] < cost.material
    ) {
      A.toast("Te falta oro o material para esta mejora.");
      return;
    }

    A.state.hero.gold -= cost.gold;
    game().materials[cost.materialId] -= cost.material;
    item.level++;

    A.save();
    A.sound("reward");
    A.toast(`${itemLabel(item)} mejorado.`);
    A.render();
  }

  function salvageItem(id) {
    if (game().battle) {
      A.toast("Gestiona los objetos entre expediciones.");
      return;
    }

    const item = instance(id);
    const def = definition(item);
    if (!def) return;

    if (Object.values(game().equipment).includes(id)) {
      A.toast("Desequipa el objeto antes de reciclarlo.");
      return;
    }

    const amount = 1 + def.quality + (item.level || 0);
    const material = REGIONS[def.region - 1];

    A.modal(
      "Reciclar objeto",
      `<p>${E(itemLabel(item))}</p>
       <p>Recibirás ${amount} ${E(material.materialName)}.</p>
       <p class="muted smalltext">
         La pieza desaparecerá de tu mochila, pero seguirá descubierta en el catálogo.
       </p>
       ${B("Confirmar reciclaje", "confirm-salvage", { item: id }, "danger full")}`
    );
  }

  function craftItem(defId) {
    if (game().battle) {
      A.toast("Fabrica objetos entre expediciones.");
      return;
    }

    const def = ITEMS[defId];
    if (!def || def.rarity === "legendary") return;
    if (!stageUnlocked((def.region - 1) * 5 + 1)) return;

    const region = REGIONS[def.region - 1];
    const cost = craftCost(def);

    if (
      A.state.hero.gold < cost.gold ||
      game().materials[region.material] < cost.material
    ) {
      A.toast("No tienes suficientes recursos.");
      return;
    }

    A.state.hero.gold -= cost.gold;
    game().materials[region.material] -= cost.material;
    addItem(defId);

    A.save();
    A.sound("reward");
    A.toast(`${def.name}: fabricado.`);
    A.render();
  }

  function craftCost(def) {
    return {
      gold: 65 * def.region * (def.quality + 1),
      material: 3 + def.quality * 4
    };
  }

  function autoEquip() {
    if (game().battle) {
      A.toast("El equipo no cambia durante una expedición.");
      return;
    }

    for (const slot of ["weapon", "armor", "charm"]) {
      const candidates = game().inventory.filter(
        item => definition(item)?.slot === slot
      );

      const score = item => {
        const stats = itemStats(item);
        return stats.attack * 3 + stats.defense * 3 +
          stats.hp * .4 + stats.crit * 2 + stats.mana * 2;
      };

      candidates.sort((a, b) => score(b) - score(a));
      game().equipment[slot] = candidates[0]?.id || null;
    }

    A.save();
    A.sound("click");
    A.toast("Equipo recomendado aplicado.");
    A.render();
  }

  function adventureTab() {
    return A.state.ui.subpage.adventure || "campaign";
  }

  function adventureTabs() {
    const current = adventureTab();

    return `<div class="tabs">
      ${[
        ["campaign", "🗺️ Campaña"],
        ["expedition", "⚔️ Expedición"],
        ["guide", "📖 Cómo jugar"]
      ].map(([id, name]) =>
        B(name, "adventure-tab", { tab: id }, current === id ? "active" : "")
      ).join("")}
    </div>`;
  }

  function renderAdventure() {
    prepareGame();

    const views = {
      campaign: campaignPanel,
      expedition: expeditionPanel,
      guide: gameGuide
    };

    return adventureTabs() + (views[adventureTab()] || campaignPanel)();
  }

  function campaignPanel() {
    const cleared = Object.keys(game().cleared).length;
    const stats = heroStats();

    return `
      <section class="card hero">
        <h2>Crónicas del Alba</h2>
        <p class="muted">
          Seis regiones, treinta rutas y seis guardianes.
          Cada ruta contiene tres combates y una decisión de exploración.
        </p>

        <div class="row between smalltext">
          <span>Rutas superadas</span><strong>${cleared}/30</strong>
        </div>
        ${A.progress(cleared, 30)}

        <div class="row wrap" style="margin-top:12px">
          <span class="badge">⚔️ ATQ ${stats.attack}</span>
          <span class="badge">🛡️ DEF ${stats.defense}</span>
          <span class="badge">❤️ Vida ${stats.hp}</span>
          <span class="badge">⚡ Energía ${game().energy}/8</span>
        </div>

        ${expeditionBlocked()
          ? `<div style="margin-top:14px">
              ${B("Continuar expedición o recoger botín",
                "adventure-tab", { tab: "expedition" }, "gold full")}
             </div>`
          : ""}
      </section>

      ${REGIONS.map(region => {
        const firstStage = (region.id - 1) * 5 + 1;
        const unlocked = stageUnlocked(firstStage);

        return `
          <section class="card">
            <div class="region-banner">
              <h3>${region.icon} ${E(region.name)}</h3>
              <p class="muted smalltext">${E(region.text)}</p>
              ${!unlocked
                ? `<span class="badge">🔒 Supera la región anterior</span>`
                : `<span class="badge">
                    ${region.materialIcon} ${game().materials[region.material]}
                    ${E(region.materialName)}
                   </span>`}
            </div>

            <div class="grid two">
              ${[0, 1, 2, 3, 4].map(index => {
                const stage = firstStage + index;
                const available = stageUnlocked(stage);
                const done = !!game().cleared[stage];
                const boss = stage % 5 === 0;
                const disabled = !available || expeditionBlocked() ||
                  game().energy < 1;

                return `
                  <button class="stage-button
                    ${done ? "cleared" : ""}
                    ${stage === frontier() ? "current" : ""}"
                    data-action="start-expedition"
                    data-stage="${stage}"
                    ${disabled ? "disabled" : ""}>
                    <span class="stage-icon">
                      ${!available ? "🔒" : done ? "✅" : boss ? region.boss[1] : "🧭"}
                    </span>
                    <strong>Ruta ${stage}${boss ? " · Guardián" : ""}</strong>
                    <div class="smalltext muted">
                      ${done ? "Repetible · 1 energía" :
                        available ? "Nueva ruta · 1 energía" : "Pendiente"}
                    </div>
                  </button>`;
              }).join("")}
            </div>
          </section>`;
      }).join("")}`;
  }

  function expeditionPanel() {
    if (game().pendingLoot) return lootPanel();

    const battle = game().battle;

    if (!battle) {
      return `
        <section class="card">
          <h2>Tu próxima expedición</h2>
          <p>Elige una ruta de la campaña para entrar.</p>
          <p class="muted smalltext">
            Cada entrada cuesta una energía.
            La expedición se guarda después de cada acción.
          </p>
          ${B("Abrir campaña", "adventure-tab",
            { tab: "campaign" }, "primary full")}
        </section>`;
    }

    const region = regionFor(battle.stage);

    if (battle.phase === "defeat") {
      return `
        <section class="card">
          <div class="enemy-art">🏕️</div>
          <h2>Regresas al campamento</h2>
          <p>Esta expedición no ha salido como esperabas.</p>
          <p class="muted">
            No pierdes objetos, oro ni experiencia.
            Puedes mejorar tu equipo o intentar una ruta anterior.
          </p>
          ${B("Volver al mapa", "close-defeat", {}, "primary full")}
        </section>`;
    }

    if (battle.phase === "event") return eventPanel(battle);

    if (battle.phase === "between") {
      return `
        <section class="card">
          <h2>Encuentro superado</h2>
          <p class="greentext">
            ${battle.enemy.icon} ${E(battle.enemy.name)} derrotado.
          </p>
          <p>
            Te quedan ${battle.hp}/${battle.maxHp} de vida
            y ${battle.potions} pociones.
          </p>
          ${B("Seguir explorando", "next-encounter", {}, "gold full")}
          <div style="margin-top:10px">
            ${B("Terminar expedición", "abandon-expedition", {}, "ghost full")}
          </div>
        </section>`;
    }

    const enemy = battle.enemy;
    const heavy = enemy.turn % 3 === 0;

    return `
      <div class="combat-layout">
        <section class="card">
          <div class="row between wrap">
            <span class="badge">Ruta ${battle.stage}</span>
            <span class="badge">Encuentro ${battle.room + 1}/3</span>
          </div>

          <p class="muted smalltext" style="margin-top:10px">
            ${region.icon} ${E(region.name)}
          </p>

          <div class="enemy-art">${enemy.icon}</div>
          <h2 style="text-align:center">
            ${E(enemy.name)}
            ${enemy.boss ? '<span class="goldtext"> · JEFE</span>' : ""}
          </h2>

          <div class="row between smalltext">
            <span>Vida del enemigo</span>
            <strong>${enemy.hp}/${enemy.maxHp}</strong>
          </div>
          ${A.progress(enemy.hp, enemy.maxHp, "var(--red)")}

          <div class="enemy-intent">
            ${heavy ? "⚠️" : "👁️"} ${enemyIntent(enemy)}
          </div>

          <div class="divider"></div>

          <div class="row between smalltext">
            <strong>Tu vida</strong>
            <span>${battle.hp}/${battle.maxHp}</span>
          </div>
          ${A.progress(battle.hp, battle.maxHp, "var(--green)")}

          <div class="row wrap smalltext" style="margin-top:10px">
            <span class="badge">🔵 Maná ${battle.mana}/${battle.maxMana}</span>
            <span class="badge">🧪 Pociones ${battle.potions}</span>
          </div>

          <div class="grid two" style="margin-top:14px">
            ${B("⚔️ Atacar", "combat-action",
              { move: "attack" }, "primary")}
            ${B("🛡️ Defender", "combat-action",
              { move: "guard" })}
            <button class="gold"
              data-action="combat-action" data-move="skill"
              ${battle.mana < 3 || battle.cooldown > 0 ? "disabled" : ""}>
              🌅 Corte del Alba
              <div class="smalltext">
                ${battle.cooldown > 0
                  ? `Disponible en ${battle.cooldown} acciones`
                  : "3 maná"}
              </div>
            </button>
            <button data-action="combat-action" data-move="potion"
              ${battle.potions < 1 || battle.hp >= battle.maxHp ? "disabled" : ""}>
              🧪 Curarte
              <div class="smalltext">Consume tu turno</div>
            </button>
          </div>
        </section>

        <section class="card">
          <h3>Diario de combate</h3>
          <div class="battle-log">
            ${battle.log.map(line => `<div>${E(line)}</div>`).join("")}
          </div>

          <p class="muted smalltext" style="margin-top:14px">
            No hay prisa. El enemigo solo actúa después de tu decisión.
            Defender reduce el daño y restaura un maná.
          </p>

          ${B("Terminar expedición", "abandon-expedition", {}, "ghost full")}
        </section>
      </div>`;
  }

  function eventPanel(battle) {
    return `
      <section class="card hero">
        <div class="enemy-art">🗺️</div>
        <h2>Un desvío en el camino</h2>
        <p>Encuentras una fuente, unas ruinas y un cofre abandonado.</p>
        <p class="muted smalltext">
          Elige una sola opción. La decisión se guarda inmediatamente.
        </p>

        <div class="stack">
          ${B(
            "💧 Fuente: recuperar 25% de vida y 2 maná",
            "event-choice", { choice: "spring" }, "primary"
          )}
          ${B(
            "🏛️ Ruinas: conseguir 2 materiales adicionales",
            "event-choice", { choice: "ruins" }
          )}
          ${B(
            "🎲 Cofre: 65% de conseguir oro y material; 35% de sufrir una trampa",
            "event-choice", { choice: "risk" }, "gold"
          )}
        </div>
      </section>`;
  }

  function lootPanel() {
    const loot = game().pendingLoot;
    const def = ITEMS[loot.itemDef];
    const region = REGIONS[loot.region - 1];

    return `
      <section class="card reward">
        <div class="chest-art">${RARITIES[loot.rarity].icon}</div>
        <h2 style="text-align:center" class="rarity-${loot.rarity}">
          Cofre ${RARITIES[loot.rarity].name.toLowerCase()}
        </h2>

        <p style="text-align:center">
          Ruta ${loot.stage} completada
          ${loot.firstClear ? " · Primera victoria" : ""}
        </p>

        <div class="equipment-card">
          <h3 class="rarity-${def.rarity}">${def.icon} ${E(def.name)}</h3>
          <p class="muted smalltext">
            ${SLOT_NAMES[def.slot]} · ${RARITIES[def.rarity].name}
          </p>
          <p class="smalltext">${statText({ defId: def.id, level: 0 })}</p>
        </div>

        <div class="grid two" style="margin-top:12px">
          <div class="stat">✨ ${loot.xp} EXP</div>
          <div class="stat">🪙 ${loot.gold} oro</div>
          <div class="stat">💎 ${loot.crystals} cristales</div>
          <div class="stat">
            ${region.materialIcon} ${loot.material} materiales
          </div>
        </div>

        ${loot.uniqueBossItem
          ? `<p class="goldtext smalltext" style="margin-top:12px">
              Arma única de guardián: recompensa garantizada de su primera victoria.
             </p>`
          : ""}

        <div style="margin-top:14px">
          ${B("Recoger todo", "collect-loot", {}, "gold full")}
        </div>
      </section>`;
  }

  function gameGuide() {
    return `
      <section class="card">
        <h2>Cómo jugar</h2>
        <div class="stack">
          <div class="stat">
            <strong style="font-size:17px">1. Entrar</strong>
            Cada ruta cuesta una energía y tiene tres encuentros.
            Repetir una ruta también cuesta energía.
          </div>
          <div class="stat">
            <strong style="font-size:17px">2. Leer al enemigo</strong>
            Cada tercer turno prepara un ataque fuerte.
            La intención aparece antes de que elijas.
          </div>
          <div class="stat">
            <strong style="font-size:17px">3. Gestionar recursos</strong>
            Defender reduce el golpe recibido y recupera maná.
            Curarte consume un turno y una de tus dos pociones.
          </div>
          <div class="stat">
            <strong style="font-size:17px">4. Elegir el desvío</strong>
            Después del primer combate decides entre recuperación,
            materiales seguros o un cofre arriesgado.
          </div>
          <div class="stat">
            <strong style="font-size:17px">5. Recoger botín</strong>
            El cofre queda guardado aunque cierres la app.
            Recógelo para desbloquear la siguiente ruta.
          </div>
          <div class="stat">
            <strong style="font-size:17px">6. Construir tu equipo</strong>
            Equipa tres piezas, mejóralas hasta +5 o fabrica
            una pieza concreta usando materiales.
          </div>
        </div>

        <p class="muted smalltext" style="margin-top:14px">
          No hay compras reales ni obligación de entrenar más.
          El juego conserva tu progreso cuando pierdes un combate.
          Las piezas comunes, raras y épicas se pueden fabricar.
        </p>
      </section>`;
  }

  function collectionTab() {
    return A.state.ui.subpage.collection || "equipment";
  }

  function renderCollection() {
    prepareGame();
    const current = collectionTab();

    const tabs = `<div class="tabs">
      ${[
        ["equipment", "⚔️ Equipo"],
        ["forge", "⚒️ Fabricación"],
        ["catalogue", "📚 Catálogo"],
        ["bestiary", "🐉 Bestiario"]
      ].map(([id, name]) =>
        B(name, "collection-tab", { tab: id }, current === id ? "active" : "")
      ).join("")}
    </div>`;

    const views = {
      equipment: equipmentPanel,
      forge: forgePanel,
      catalogue: cataloguePanel,
      bestiary: bestiaryPanel
    };

    return tabs + (views[current] || equipmentPanel)();
  }

  function equipmentPanel() {
    const stats = heroStats();

    const inventory = [...game().inventory].sort((a, b) => {
      const da = definition(a);
      const db = definition(b);
      return (db?.region || 0) - (da?.region || 0) ||
        (db?.quality || 0) - (da?.quality || 0);
    });

    return `
      <section class="card">
        <h2>Tu equipo</h2>
        <div class="grid three">
          <div class="stat"><strong>${stats.attack}</strong>ATQ</div>
          <div class="stat"><strong>${stats.defense}</strong>DEF</div>
          <div class="stat"><strong>${stats.hp}</strong>Vida</div>
        </div>

        <div class="stack" style="margin-top:12px">
          ${Object.entries(SLOT_NAMES).map(([slot, name]) => {
            const item = instance(game().equipment[slot]);
            return `<div class="stat">
              <span class="muted smalltext">${name}</span>
              <div>${item ? E(itemLabel(item)) : "Sin equipar"}</div>
            </div>`;
          }).join("")}
        </div>

        <div style="margin-top:12px">
          ${B("Equipar combinación recomendada",
              "auto-equip", {}, "primary full")}
        </div>
      </section>

      <section class="card">
        <h3>Mochila · ${inventory.length} objetos</h3>
        ${inventory.length
          ? `<div class="stack">${inventory.map(item => {
              const def = definition(item);
              if (!def) return "";

              const equipped = game().equipment[def.slot] === item.id;
              const cost = upgradeCost(item);

              return `<div class="equipment-card ${equipped ? "equipped" : ""}">
                <h3 class="rarity-${def.rarity}">
                  ${def.icon} ${E(itemLabel(item))}
                </h3>
                <p class="muted smalltext">
                  ${RARITIES[def.rarity].name} · ${SLOT_NAMES[def.slot]}
                  ${equipped ? " · EQUIPADO" : ""}
                </p>
                <p class="smalltext">${statText(item)}</p>

                <div class="row wrap">
                  ${B(equipped ? "Desequipar" : "Equipar",
                      "equip-item", { item: item.id }, "small")}
                  ${item.level < 5
                    ? B(`Mejorar: ${cost.gold} oro + ${cost.material} materiales`,
                        "upgrade-item", { item: item.id }, "small gold")
                    : `<span class="badge goldtext">Mejora máxima +5</span>`}
                  ${!equipped
                    ? B("Reciclar", "salvage-item",
                        { item: item.id }, "small ghost")
                    : ""}
                </div>
              </div>`;
            }).join("")}</div>`
          : `<div class="empty">
              Tu primer objeto llegará al superar una expedición.
             </div>`}
      </section>`;
  }

  function forgePanel() {
    return `
      <section class="card">
        <h2>Fabricación</h2>
        <p class="muted">
          No dependas solo del azar:
          usa tus materiales para fabricar una pieza concreta.
        </p>
      </section>

      ${REGIONS.filter(region =>
        stageUnlocked((region.id - 1) * 5 + 1)
      ).map(region => `
        <section class="card">
          <h3>${region.icon} ${E(region.name)}</h3>
          <p class="goldtext smalltext">
            ${region.materialIcon} ${game().materials[region.material]}
            ${E(region.materialName)}
          </p>

          <div class="stack">
            ${Object.values(ITEMS).filter(def =>
              def.region === region.id && def.rarity !== "legendary"
            ).map(def => {
              const cost = craftCost(def);
              const affordable =
                A.state.hero.gold >= cost.gold &&
                game().materials[region.material] >= cost.material;

              return `<div class="equipment-card">
                <strong class="rarity-${def.rarity}">
                  ${def.icon} ${E(def.name)}
                </strong>
                <p class="smalltext muted" style="margin:5px 0">
                  ${statText({ defId: def.id, level: 0 })}
                </p>
                <button data-action="craft-item" data-item="${def.id}"
                  class="small" ${!affordable ? "disabled" : ""}>
                  Fabricar · ${cost.gold} oro · ${cost.material} materiales
                </button>
              </div>`;
            }).join("")}
          </div>
        </section>`
      ).join("")}`;
  }

  function cataloguePanel() {
    const owned = Object.keys(game().itemCodex).filter(id => ITEMS[id]).length;
    const total = Object.keys(ITEMS).length;

    return `
      <section class="card">
        <h2>Catálogo de equipo</h2>
        <div class="row between smalltext">
          <span>Descubrimientos permanentes</span>
          <strong>${owned}/${total}</strong>
        </div>
        ${A.progress(owned, total)}
        <p class="muted smalltext" style="margin-top:10px">
          Reciclar una pieza no elimina su descubrimiento.
          Las armas únicas se obtienen en la primera victoria
          contra el guardián de cada región.
        </p>
      </section>

      ${REGIONS.map(region => `
        <section class="card">
          <h3>${region.icon} ${E(region.name)}</h3>
          <div class="grid two">
            ${Object.values(ITEMS).filter(def =>
              def.region === region.id
            ).map(def => {
              const found = !!game().itemCodex[def.id];
              return `<div class="stat">
                <div style="font-size:28px">${found ? def.icon : "🔒"}</div>
                <strong style="font-size:14px"
                  class="${found ? `rarity-${def.rarity}` : "muted"}">
                  ${found ? E(def.name) : "Pieza por descubrir"}
                </strong>
                <span class="smalltext muted">${RARITIES[def.rarity].name}</span>
              </div>`;
            }).join("")}
          </div>
        </section>`
      ).join("")}`;
  }

  function bestiaryPanel() {
    return `
      <section class="card">
        <h2>Bestiario</h2>
        <p class="muted">Los enemigos quedan registrados al derrotarlos.</p>
      </section>

      ${REGIONS.map(region => `
        <section class="card">
          <h3>${region.icon} ${E(region.name)}</h3>
          <div class="grid two">
            ${[...region.enemies, region.boss].map(source => {
              const id = `${region.id}-${source[0]}`;
              const count = game().collection[id] || 0;

              return `<div class="stat">
                <div style="font-size:34px">${count ? source[1] : "❔"}</div>
                <strong style="font-size:14px">
                  ${count ? E(source[2]) : "Desconocido"}
                </strong>
                <span class="smalltext muted">
                  ${count ? `${count} derrotas` : "Aún no registrado"}
                </span>
              </div>`;
            }).join("")}
          </div>
        </section>`
      ).join("")}`;
  }

  /*
   * Registro de acciones.
   */
  A.registerAction("adventure-tab", data => {
    A.state.ui.page = "adventure";
    A.state.ui.subpage.adventure = data.tab;
    A.save();
    A.render();
  });

  A.registerAction("collection-tab", data => {
    A.state.ui.page = "collection";
    A.state.ui.subpage.collection = data.tab;
    A.save();
    A.render();
  });

  A.registerAction("start-expedition", data =>
    startExpedition(Number(data.stage))
  );

  A.registerAction("combat-action", data => combatAction(data.move));
  A.registerAction("event-choice", data => eventChoice(data.choice));
  A.registerAction("next-encounter", nextEncounter);
  A.registerAction("collect-loot", collectLoot);
  A.registerAction("abandon-expedition", abandonExpedition);

  A.registerAction("confirm-abandon", () => {
    game().battle = null;
    A.closeModal();
    A.save();
    A.render();
  });

  A.registerAction("close-defeat", () => {
    if (game().battle?.phase !== "defeat") return;
    game().battle = null;
    A.state.ui.subpage.adventure = "campaign";
    A.save();
    A.render();
  });

  A.registerAction("equip-item", data => equipItem(data.item));
  A.registerAction("upgrade-item", data => upgradeItem(data.item));
  A.registerAction("salvage-item", data => salvageItem(data.item));
  A.registerAction("craft-item", data => craftItem(data.item));
  A.registerAction("auto-equip", autoEquip);

  A.registerAction("confirm-salvage", data => {
    if (game().battle) return;

    const item = instance(data.item);
    const def = definition(item);
    if (!def || Object.values(game().equipment).includes(data.item)) return;

    const materialId = REGIONS[def.region - 1].material;
    const amount = 1 + def.quality + (item.level || 0);

    game().inventory = game().inventory.filter(i => i.id !== data.item);
    game().materials[materialId] += amount;

    A.closeModal();
    A.save();
    A.toast("Objeto reciclado. El descubrimiento se conserva.");
    A.render();
  });

  A.registerPage("adventure", renderAdventure);
  A.registerPage("collection", renderCollection);

  /*
   * La parte 4 usa estos datos para talentos,
   * logros, historia y comprobaciones.
   */
  A.rpg = {
    REGIONS,
    ITEMS,
    RARITIES,
    SLOT_NAMES,
    prepareGame,
    heroStats,
    itemStats,
    instance,
    definition,
    itemLabel,
    frontier,
    stageUnlocked,
    addItem,
    startExpedition,
    combatAction,
    collectLoot,
    upgradeCost
  };
})();
</script>

    );

    return {
      habits,
      programming: countTask("dev"),
      piano: countTask("piano"),
      dutch: countTask("dutch"),

        r => r.mode === "recovery"

  function queueAchievements() {

    });

  function checkAchievements() {
    const stats = statistics();
    let changed = false;

    for (const [id, name, , , qualifies, xp, gold] of ACHIEVEMENTS) {
      if (game().achievements[id] || !qualifies(stats)) continue;

      /*
       * Marcar antes de dar la recompensa evita un bucle de desbloqueo.
       */
      game().achievements[id] = { at: Date.now() };
      A.reward(
        `achievement:${id}`,
        { xp, gold, crystals: 3 },
        `Logro: ${name}`
      );
      changed = true;
    }

    if (changed) {
      A.save();
      A.render();
    }
  }

  function measurementChart(field, label) {
    const points = A.state.records.measures.filter(
      record => Number.isFinite(record[field])
    );

    if (points.length < 2) {
      return `<div class="empty">${E(label)}: necesitas dos registros.</div>`;
    }

    const values = points.map(point => point[field]);
    const minimum = Math.min(...values);
    const maximum = Math.max(...values);
    const range = maximum - minimum || 1;

    const coordinates = points.map((point, index) => {
      const x = 12 + index / (points.length - 1) * 276;
      const y = 130 - (point[field] - minimum) / range * 110;
      return `${x.toFixed(2)},${y.toFixed(2)}`;
    }).join(" ");

    return `
      <div class="row between smalltext muted">
        <span>${E(label)} · ${minimum}–${maximum}</span>
        <span>${points.length} registros</span>
      </div>
      <svg class="measure-chart" viewBox="0 0 300 150"
           role="img" aria-label="${E(label)}: evolución de registros">
        <line x1="12" y1="140" x2="288" y2="140" stroke="#39465d"/>
        <polyline points="${coordinates}" fill="none"
          stroke="#82b4ff" stroke-width="3" stroke-linejoin="round"/>
      </svg>
      <div class="row between smalltext muted">
        <span>${E(points[0].date)}</span>
        <span>${E(points.at(-1).date)}</span>
      </div>`;
  }

  /*
   * Importación: normalizar primero y sustituir después.
   * Una importación inválida no reemplaza el estado actual.
   */
  function normaliseSave(input) {
    if (!input || typeof input !== "object" || input.version !== A.VERSION) {
      throw new Error("Solo se admiten partidas de esta versión v3.");
    }

    const base = A.freshState();

    const objectFields = [
      "profile", "hero", "training", "records", "game",
      "settings", "ui", "days", "rewards"
    ];

    for (const field of objectFields) {
      if (
        !input[field] || typeof input[field] !== "object" ||
        Array.isArray(input[field])
      ) {
        throw new Error(`La partida no contiene un campo válido: ${field}.`);
      }
    }

    for (const field of [
      "profile", "hero", "training", "records", "game", "settings", "ui"
    ]) {
      base[field] = { ...base[field], ...input[field] };
    }

    base.days = input.days;
    base.rewards = input.rewards;
    base.createdAt = Number(input.createdAt) || Date.now();

    const numbers = [
      ["Nivel", base.hero.level, 1, 100000],
      ["Experiencia", base.hero.xp, 0, 1000000000],
      ["Oro", base.hero.gold, 0, 1000000000],
      ["Cristales", base.hero.crystals, 0, 1000000000],
      ["Energía", base.game.energy, 0, 8],
      ["Carga", base.training.addedKg, 0, 100]
    ];

    for (const [name, value, min, max] of numbers) {
      if (!Number.isFinite(value) || value < min || value > max) {
        throw new Error(`${name}: valor inválido.`);
      }
    }

    for (const [name, value] of [
      ["Historial", base.training.history],
      ["Medidas", base.records.measures],
      ["Fotos", base.records.photos],
      ["Inventario", base.game.inventory],
      ["Historia", base.game.unlockedStories]
    ]) {
      if (!Array.isArray(value)) throw new Error(`${name}: formato inválido.`);
    }

    const ids = new Set();

    for (const item of base.game.inventory) {
      if (
        !item || typeof item.id !== "string" ||
        !A.rpg.ITEMS[item.defId] ||
        !Number.isInteger(item.level) || item.level < 0 || item.level > 5 ||
        ids.has(item.id)
      ) {
        throw new Error("El inventario contiene un objeto inválido o duplicado.");
      }
      ids.add(item.id);
    }

    base.game.equipment = {
      weapon: null, armor: null, charm: null,
      ...(base.game.equipment || {})
    };

    for (const slot of ["weapon", "armor", "charm"]) {
      const id = base.game.equipment[slot];
      if (!id) continue;

      const item = base.game.inventory.find(i => i.id === id);
      if (!item || A.rpg.ITEMS[item.defId].slot !== slot) {
        throw new Error("Hay un objeto equipado en un hueco incorrecto.");
      }
    }

    base.game.talents ||= {};

    for (const talent of TALENTS) {
      const value = base.game.talents[talent.id] || 0;
      if (!Number.isInteger(value) || value < 0 || value > talent.max) {
        throw new Error("Los talentos contienen un rango inválido.");
      }
    }

    for (const [date, record] of Object.entries(base.days)) {
      if (
        !/^\d{4}-\d{2}-\d{2}$/.test(date) ||
        !record || typeof record !== "object" ||
        !record.tasks || typeof record.tasks !== "object"
      ) {
        throw new Error("El archivo de días contiene un registro inválido.");
      }

      record.training ||= {};
      record.training.sets ||= [];
      record.training.exercises ||= {};
    }

    /*
     * Se comprueba el mínimo necesario de una expedición activa.
     */
    const battle = base.game.battle;

    if (battle) {
      if (
        typeof battle.id !== "string" ||
        !Number.isInteger(battle.stage) ||
        battle.stage < 1 || battle.stage > 30 ||
        !Array.isArray(battle.log) ||
        !battle.stats || !battle.enemy ||
        !Number.isFinite(battle.hp) ||
        !Number.isFinite(battle.enemy.hp)
      ) {
        throw new Error("La expedición activa no tiene un formato válido.");
      }
    }

    const loot = base.game.pendingLoot;
    if (loot && (
      typeof loot.id !== "string" ||
      !A.rpg.ITEMS[loot.itemDef] ||
      !Number.isInteger(loot.region) ||
      loot.region < 1 || loot.region > 6
    )) {
      throw new Error("El cofre pendiente no tiene un formato válido.");
    }

    base.ui.page = "profile";
    base.ui.subpage = { ...(base.ui.subpage || {}), profile: "overview" };
    return base;
  }

  function downloadSave() {
    const json = JSON.stringify(A.state, null, 2);
    const blob = new Blob([json], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");

    link.href = url;
    link.download = `system-alba-${A.dateKey()}.json`;
    document.body.appendChild(link);
    link.click();
    link.remove();

    setTimeout(() => URL.revokeObjectURL(url), 2000);
    A.toast("Exportación solicitada. Comprueba que el archivo se ha guardado.");
  }

  async function importFile() {
    const file = A.$("import-save-file")?.files?.[0];

    if (!file) {
      A.toast("Selecciona primero un archivo JSON.");
      return;
    }

    if (file.size > 8 * 1024 * 1024) {
      A.toast("El archivo supera el límite de 8 MB.");
      return;
    }

    let next;
    try {
      next = normaliseSave(JSON.parse(await file.text()));
    } catch (error) {
      A.toast(`No se importó: ${error.message}`);
      return;
    }

    if (!confirm("¿Sustituir esta partida por el archivo seleccionado? Exporta antes si quieres conservarla.")) {
      return;
    }

    /*
     * Escribir directamente y recargar permite que la parte 1
     * vuelva a evaluar la disponibilidad del almacenamiento.
     */
    try {
      localStorage.setItem(A.BACKUP_KEY, JSON.stringify(A.state));
      localStorage.setItem(A.KEY, JSON.stringify(next));
      location.reload();
    } catch (error) {
      A.toast("No se pudo guardar la importación. La partida actual sigue abierta.");
    }
  }

  function restoreBackup() {
    let next;

    try {
      const raw = localStorage.getItem(A.BACKUP_KEY);
      if (!raw) throw new Error("No hay una copia automática anterior.");
      next = normaliseSave(JSON.parse(raw));
    } catch (error) {
      A.toast(error.message);
      return;
    }

    if (!confirm("¿Recuperar el guardado automático anterior?")) return;

    try {
      localStorage.setItem(A.KEY, JSON.stringify(next));
      location.reload();
    } catch (error) {
      A.toast("No se pudo recuperar la copia.");
    }
  }

  function runDiagnostics() {
    const tests = [];

    function test(name, callback) {
      try {
        const result = callback();
        tests.push({
          name,
          ok: !!result,
          detail: result ? "" : "Revisa el ensamblado de las cuatro partes."
        });
      } catch (error) {
        tests.push({ name, ok: false, detail: error.message });
      }
    }

    test("Motor de hábitos conectado", () =>
      typeof A.life.completeTask === "function"
    );

    test("Motor de combate conectado", () =>
      typeof A.rpg.combatAction === "function"
    );

    test("Seis regiones disponibles", () =>
      A.rpg.REGIONS.length === 6
    );

    test("Catálogo de 60 piezas", () =>
      Object.keys(A.rpg.ITEMS).length === 60
    );

    test("Seis piezas legendarias únicas", () =>
      Object.values(A.rpg.ITEMS).filter(
        item => item.rarity === "legendary"
      ).length === 6
    );

    test("Identificadores de misiones únicos", () =>
      new Set(A.life.TASKS.map(task => task.id)).size === A.life.TASKS.length
    );

    test("Identificadores de logros únicos", () =>
      new Set(ACHIEVEMENTS.map(row => row[0])).size === ACHIEVEMENTS.length
    );

    test("Calendario físico respetado", () =>
      [1, 4, 6].every(day => A.WEEK_PLAN[day].type === "cal") &&
      [2, 5].every(day => A.WEEK_PLAN[day].type === "pull") &&
      [0, 3].every(day => A.WEEK_PLAN[day].type === "rest")
    );

    test("Cena fija a las 21:00", () =>
      A.DAILY_SCHEDULE.some(row =>
        row[0] === "21:00" && row[1] === "21:30"
      )
    );

    test("Aritmética de fechas", () =>
      A.dayDifference("2026-10-05", "2026-10-19") === 14 &&
      A.shiftDate("2026-10-05", 1) === "2026-10-06"
    );

    test("Estadísticas del personaje finitas", () =>
      Object.values(A.rpg.heroStats()).every(
        value => Number.isFinite(value) && value >= 0
      )
    );

    test("Instancias de inventario sin duplicados", () =>
      new Set(game().inventory.map(item => item.id)).size ===
        game().inventory.length
    );

    test("Los objetos de la mochila existen en el catálogo", () =>
      game().inventory.every(item => !!A.rpg.ITEMS[item.defId])
    );

    test("Elementos de interfaz presentes", () =>
      ["hud", "screen", "navigation", "modal", "toast"].every(id => A.$(id))
    );

    test("Guardado actual con estructura importable", () => {
      normaliseSave(JSON.parse(JSON.stringify(A.state)));
      return true;
    });

    lastDiagnostics = tests;
    return tests;
  }

  /*
   * Acciones de progreso.
   */
  A.registerAction("profile-tab", data => {
    A.state.ui.page = "profile";
    A.state.ui.subpage.profile = data.tab;
    A.save();
    A.render();
  });

  A.registerAction("claim-weekly", data => {
    const goal = WEEKLY.find(item => item.id === data.goal);
    const dates = weekDates();

    if (!goal || goal.count(dates) < goal.target) return;

    A.reward(
      `weekly:${dates[0]}:${goal.id}`,
      { xp: 60, gold: 40, crystals: 8 },
      goal.name
    );
    A.render();
  });

  A.registerAction("buy-talent", data => {
    const talent = TALENTS.find(item => item.id === data.talent);
    if (!talent || game().battle) return;

    const invested = game().talents[talent.id] || 0;
    if (invested >= talent.max || A.state.hero.talentPoints < 1) return;

    game().talents[talent.id] = invested + 1;
    A.state.hero.talentPoints--;

    A.save();
    A.sound("reward");
    A.render();
  });

  A.registerAction("reset-talents", () => {
    if (game().battle) {
      A.toast("Redistribuye los talentos entre expediciones.");
      return;
    }

    const points = Object.values(game().talents).reduce(
      (sum, value) => sum + value, 0
    );

    game().talents = {};
    A.state.hero.talentPoints += points;

    A.save();
    A.toast("Puntos de talento recuperados.");
    A.render();
  });

  A.registerAction("read-story", data => {
    const story = STORIES.find(item => item.id === data.story);
    if (!story || story.stage && !game().cleared[story.stage]) return;

    if (!game().unlockedStories.includes(story.id)) {
      game().unlockedStories.push(story.id);
      A.save();
    }

    A.modal(
      story.title,
      `<div class="story-heading">${story.icon}</div>
       <div class="story-page">
         ${story.paragraphs.map(text => `<p>${E(text)}</p>`).join("")}
       </div>`
    );
  });

  A.registerAction("save-measures", () => {
    const fields = [
      ["waist", "measure-waist"],
      ["weight", "measure-weight"],
      ["arm", "measure-arm"]
    ];

    const record = { date: A.dateKey() };
    let any = false;

    for (const [key, elementId] of fields) {
      const raw = A.$(elementId).value.trim();
      if (!raw) continue;

      const value = Number(raw);
      if (!Number.isFinite(value) || value <= 0 || value > 1000) {
        A.toast("Comprueba las medidas introducidas.");
        return;
      }

      record[key] = value;
      any = true;
    }

    if (!any) {
      A.toast("Rellena al menos una medida.");
      return;
    }

    const previous = A.state.records.measures.find(
      item => item.date === record.date
    );

    A.state.records.measures = A.state.records.measures.filter(
      item => item.date !== record.date
    );

    A.state.records.measures.push({ ...(previous || {}), ...record });
    A.state.records.measures.sort((a, b) => a.date.localeCompare(b.date));

    A.save();
    queueAchievements();
    A.toast("Medidas guardadas.");
    A.render();
  });

  A.registerAction("save-profile", () => {
    const name = A.$("profile-name").value.trim();
    const title = A.$("profile-title").value;

    A.state.profile.name = name || "Cazador";
    A.state.profile.title = titleOptions().includes(title) ? title : "";

    A.save();
    A.toast("Perfil actualizado.");
    A.render();
  });

  A.registerAction("toggle-sound", () => {
    A.state.settings.sound = !A.state.settings.sound;
    A.save();
    A.render();
  });

  A.registerAction("export-save", downloadSave);

  A.registerAction("show-save-json", () => {
    A.modal(
      "Copia de seguridad en texto",
      `<p class="muted smalltext">
         Copia todo el contenido. Es tu partida, no un enlace.
       </p>
       <textarea id="save-json-text" rows="10" readonly></textarea>`
    );

    A.$("save-json-text").value = JSON.stringify(A.state, null, 2);
    A.$("save-json-text").select();
  });

  A.registerAction("import-save", importFile);
  A.registerAction("restore-backup", restoreBackup);

  A.registerAction("run-diagnostics", () => {
    const tests = runDiagnostics();
    A.render();

    const failures = tests.filter(test => !test.ok).length;
    A.toast(failures
      ? `${failures} comprobación(es) necesitan revisión.`
      : "Comprobaciones básicas completadas sin errores."
    );
  });

  A.registerAction("request-reset", () => {
    A.modal(
      "Reiniciar esta partida",
      `<p class="redtext">
         Esto borra la partida v3 de este navegador.
       </p>
       <p>Las partidas de versiones anteriores no se eliminan.</p>
       <p>Exporta una copia antes de continuar.</p>
       ${B("Confirmar reinicio", "confirm-reset", {}, "danger full")}`
    );
  });

  A.registerAction("confirm-reset", () => {
    if (!confirm("Última confirmación: ¿reiniciar la partida v3?")) return;

    try {
      localStorage.removeItem(A.KEY);
      localStorage.removeItem(A.BACKUP_KEY);
      location.reload();
    } catch (error) {
      A.toast("El navegador no permitió borrar el guardado.");
    }
  });

  /*
   * Corrección del ciclo de descanso:
   * registrar la cuarta serie también cierra el temporizador anterior.
   * Se hace sin cambiar las recompensas del bloque.
   */
  A.registerAction("save-pull-set", data => {
    const index = Number(data.index);

    if (!Number.isInteger(index) || index < 0 || index > 3) return;
    if (A.plan().type !== "pull") return;

    const training = A.life.day().training;
    if (training.completed || training.sets[index]) return;

    const reps = Number(A.$(`pull-reps-${index}`)?.value);
    if (!Number.isInteger(reps) || reps < 1 || reps > 50) {
      A.toast("Introduce tus repeticiones reales entre 1 y 50.");
      return;
    }

    training.sets[index] = {
      reps,
      kg: training.addedKg,
      at: Date.now()
    };
    training.clean = !!A.$("training-clean")?.checked;

    A.save();
    A.sound("click");

    if ([0, 1, 2, 3].every(i => training.sets[i])) {
      A.rest(1);
    } else {
      A.rest(120);
    }

    A.render();
  });

  /*
   * Protección al volver de una importación o guardado antiguo:
   * asegurar todos los campos del RPG antes de arrancar.
   */
  A.rpg.prepareGame();
  game().achievements ||= {};
  game().unlockedStories ||= [];

  A.registerPage("profile", renderProfile);
  A.hooks.reward.push(queueAchievements);

  A.progression = {
    TALENTS,
    ACHIEVEMENTS,
    STORIES,
    statistics,
    normaliseSave,
    runDiagnostics
  };

  /*
   * ARRANQUE FINAL.
   * Las cinco pestañas ya están registradas.
   */
  function boot() {
    A.start();
    queueAchievements();

    const tests = runDiagnostics();
    const failures = tests.filter(test => !test.ok);

    if (failures.length) {
      console.error("SYSTEM: comprobaciones pendientes", failures);
      A.toast("Hay comprobaciones pendientes. Abre Progreso → Ajustes.");
    }
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot, { once: true });
  } else {
    boot();
  }
})();
</script>

</body>
