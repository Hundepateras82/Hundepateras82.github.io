<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101321">
<title>SYSTEM · Crónicas del Alba</title>

<style>
:root {
  color-scheme: dark;
  --bg: #0b0e17;
  --panel: #141a2a;
  --panel2: #1a2236;
  --text: #edf1ff;
  --muted: #a2aec8;
  --line: #2a3550;
  --blue: #82b4ff;
  --purple: #bf9bff;
  --gold: #ffd67c;
  --green: #79dfb0;
  --red: #ff919e;
  --radius: 20px;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  color: var(--text);
  background:
    radial-gradient(ellipse at top, #20233c 0%, transparent 55%),
    var(--bg);
  font-family: system-ui, -apple-system, sans-serif;
  line-height: 1.5;
}
button, input, select, textarea { font: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: .45; }
button, a, input, select { -webkit-tap-highlight-color: transparent; }
button:focus-visible, input:focus-visible, textarea:focus-visible {
  outline: 3px solid var(--blue);
  outline-offset: 3px;
}
button {
  border: 1px solid var(--line);
  border-radius: 12px;
  color: var(--text);
  background: var(--panel2);
  padding: 11px 15px;
  font-weight: 650;
  transition: transform .12s, background .2s;
}
button:active:not(:disabled) { transform: scale(.97); }
button.primary {
  background: #314a78;
  border-color: #587ab0;
}
button.gold {
  background: #493a21;
  border-color: #8f7546;
  color: var(--gold);
}
button.danger {
  background: #472732;
  border-color: #804653;
}
button.small { padding: 7px 10px; font-size: 13px; }
button.ghost { background: transparent; }
button.full { width: 100%; }
input, select, textarea {
  width: 100%;
  min-height: 44px;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: #0c1220;
  color: var(--text);
}
label { display: block; color: var(--muted); font-size: 13px; }
h1, h2, h3, p { margin-top: 0; }
h1 { font-size: 23px; margin-bottom: 2px; }
h2 { font-size: 20px; margin-bottom: 10px; }
h3 { font-size: 16px; margin-bottom: 8px; }
p:last-child { margin-bottom: 0; }
small, .muted { color: var(--muted); }
.smalltext { font-size: 13px; }
.goldtext { color: var(--gold); }
.greentext { color: var(--green); }
.redtext { color: var(--red); }
.purpletext { color: var(--purple); }
.blue { color: var(--blue); }

#shell {
  max-width: 1120px;
  margin: auto;
  padding: calc(16px + env(safe-area-inset-top)) 16px
           calc(110px + env(safe-area-inset-bottom));
}
.card {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: linear-gradient(145deg, #192136, #101625);
  padding: 18px;
  margin-bottom: 16px;
}
.card.hero {
  border-color: #71608d;
  background: linear-gradient(125deg, #27243e, #18253e);
}
.card.reward { border-color: #90774d; }
.row { display: flex; align-items: center; gap: 12px; }
.between { justify-content: space-between; }
.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.stack { display: grid; gap: 12px; }
.grid { display: grid; gap: 12px; }
.grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid.seven { grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.badge {
  display: inline-block;
  border: 1px solid var(--line);
  border-radius: 99px;
  background: #101727;
  padding: 4px 9px;
  font-size: 12px;
}
.currency { color: var(--gold); font-weight: 750; }
.progress {
  height: 9px;
  border-radius: 99px;
  overflow: hidden;
  background: #080d17;
}
.progress > div {
  height: 100%;
  background: linear-gradient(90deg, #7799ff, #c69bff);
  transition: width .35s;
}
.divider { height: 1px; background: var(--line); margin: 14px 0; }
.empty {
  border: 1px dashed var(--line);
  padding: 24px;
  border-radius: 15px;
  text-align: center;
  color: var(--muted);
}
.tabs {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 10px;
  margin-bottom: 8px;
}
.tabs button { white-space: nowrap; }
.tabs button.active {
  color: var(--gold);
  border-color: #91764b;
}
.quest {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: 15px;
  background: #101727;
}
.quest.done { border-color: #39795f; }
.quest.done .quest-name { color: var(--green); }
.icon {
  width: 46px;
  height: 46px;
  display: grid;
  place-items: center;
  flex-shrink: 0;
  border-radius: 14px;
  background: #263149;
  font-size: 25px;
}
.avatar {
  width: 78px;
  height: 78px;
  display: grid;
  place-items: center;
  font-size: 48px;
  border-radius: 23px;
  background: #2e3553;
  box-shadow: inset 0 0 30px #7182ff22;
}
.stat {
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: #101727;
}
.stat strong { display: block; font-size: 24px; }
.day {
  text-align: center;
  font-size: 12px;
  padding: 10px 2px;
  border: 1px solid var(--line);
  border-radius: 12px;
}
.day.today { border-color: var(--blue); }
.day.done { background: #163327; border-color: #46816a; }
.day .emoji { display: block; font-size: 23px; }
.timeline {
  border-left: 2px solid var(--line);
  padding-left: 16px;
}
.timeline > div { margin-bottom: 14px; }
.timeline time {
  color: var(--blue);
  font-size: 13px;
  font-weight: 700;
}
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td {
  padding: 10px 7px;
  text-align: left;
  border-bottom: 1px solid var(--line);
}
.scroll { overflow-x: auto; }

#navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 30;
  border-top: 1px solid var(--line);
  background: #0e1424f5;
  backdrop-filter: blur(12px);
  padding: 9px 10px calc(9px + env(safe-area-inset-bottom));
}
#navigation .nav-inner {
  max-width: 850px;
  margin: auto;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 5px;
}
#navigation button {
  border: 0;
  background: transparent;
  padding: 6px 2px;
  font-size: 11px;
  color: var(--muted);
}
#navigation button span {
  display: block;
  font-size: 23px;
  margin-bottom: 3px;
}
#navigation button.active {
  color: var(--gold);
  background: #2d2940;
}
#toast {
  position: fixed;
  bottom: calc(90px + env(safe-area-inset-bottom));
  left: 50%;
  transform: translateX(-50%);
  z-index: 90;
  width: max-content;
  max-width: calc(100vw - 32px);
  border: 1px solid #7c709c;
  background: #25243b;
  border-radius: 16px;
  padding: 12px 18px;
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s;
}
#toast.visible { opacity: 1; }
dialog {
  width: min(560px, calc(100vw - 28px));
  max-height: 85vh;
  overflow-y: auto;
  border: 1px solid #706086;
  border-radius: 22px;
  background: #151c2d;
  color: var(--text);
  padding: 22px;
}
dialog::backdrop { background: #050711d9; }
dialog .dialog-footer { margin-top: 18px; }
#floating-timer {
  position: fixed;
  top: calc(10px + env(safe-area-inset-top));
  right: 12px;
  z-index: 40;
  background: #3f3221;
  border: 1px solid #af8a49;
  border-radius: 14px;
  padding: 10px 15px;
  color: var(--gold);
}
[hidden] { display: none !important; }
@media (min-width: 760px) {
  .desktop-two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
}
@media (max-width: 420px) {
  #shell { padding-left: 10px; padding-right: 10px; }
  .card { padding: 14px; }
  .grid.three { gap: 7px; }
  .stat strong { font-size: 20px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    transition: none !important;
    animation: none !important;
  }
}
</style>
</head>

<body>
<div id="shell">
  <header id="hud" aria-label="Personaje y recursos"></header>
  <main id="screen"></main>
</div>

<nav id="navigation" aria-label="Navegación principal"></nav>
<div id="toast" role="status" aria-live="polite"></div>
<div id="floating-timer" hidden></div>

<dialog id="modal">
  <h2 id="modal-title"></h2>
  <div id="modal-body"></div>
  <div class="dialog-footer">
    <button id="modal-close" class="full primary">Continuar</button>
  </div>
</dialog>

<script>
"use strict";

window.SYS = (() => {
  const VERSION = 3;
  const KEY = "system_alba_v3";
  const BACKUP_KEY = KEY + "_backup";

  const $ = id => document.getElementById(id);
  const clone = value => JSON.parse(JSON.stringify(value));

  function escape(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;",
      '"': "&quot;", "'": "&#39;"
    })[char]);
  }

  function dateKey(date = new Date()) {
    return [
      date.getFullYear(),
      String(date.getMonth() + 1).padStart(2, "0"),
      String(date.getDate()).padStart(2, "0")
    ].join("-");
  }

  function parseDate(key) {
    const [year, month, day] = key.split("-").map(Number);
    return new Date(year, month - 1, day, 12);
  }

  function shiftDate(key, amount) {
    const date = parseDate(key);
    date.setDate(date.getDate() + amount);
    return dateKey(date);
  }

  function dayDifference(first, second) {
    const a = parseDate(first);
    const b = parseDate(second);
    return Math.round(
      (Date.UTC(b.getFullYear(), b.getMonth(), b.getDate()) -
       Date.UTC(a.getFullYear(), a.getMonth(), a.getDate())) / 86400000
    );
  }

  function weekKey(key = dateKey()) {
    return shiftDate(key, -((parseDate(key).getDay() + 6) % 7));
  }

  function prettyDate(key) {
    return parseDate(key).toLocaleDateString("es-ES", {
      weekday: "long", day: "numeric", month: "long"
    });
  }

  const WEEK_PLAN = {
    0: { type: "rest", name: "Descanso", icon: "🌙" },
    1: { type: "cal", name: "Calistenia", icon: "🤸" },
    2: { type: "pull", name: "Gym: dominadas con peso", icon: "🏋️" },
    3: { type: "rest", name: "Descanso", icon: "🌿" },
    4: { type: "cal", name: "Calistenia", icon: "🤸" },
    5: { type: "pull", name: "Gym: dominadas con peso", icon: "🏋️" },
    6: { type: "cal", name: "Calistenia", icon: "🤸" }
  };

  const DAILY_SCHEDULE = [
    ["07:30", "09:00", "Prepararte y desplazarte", "🎒"],
    ["09:00", "15:15", "Clase, comida y vuelta", "🏫"],
    ["15:15", "16:00", "Descanso al volver", "🛋️"],
    ["16:00", "17:00", "Programar tu juego", "💻"],
    ["17:00", "17:30", "Merienda", "🍊"],
    ["17:30", "18:30", "Bloque físico del día", "⚔️"],
    ["18:30", "19:00", "Ducha y recuperación", "🚿"],
    ["19:00", "19:45", "Piano", "🎹"],
    ["19:45", "20:15", "Neerlandés", "🇳🇱"],
    ["20:15", "21:00", "Tiempo libre", "☕"],
    ["21:00", "21:30", "Cena", "🍽️"],
    ["21:30", "22:30", "Jugar", "🎮"],
    ["22:30", "23:00", "Preparar mañana y desconectar", "🌙"]
  ];

  const RANKS = [
    { level: 1, name: "Explorador", icon: "🧭" },
    { level: 5, name: "Aprendiz del Alba", icon: "🌅" },
    { level: 10, name: "Guardián", icon: "🛡️" },
    { level: 20, name: "Caballero", icon: "⚔️" },
    { level: 35, name: "Campeón", icon: "🦅" },
    { level: 50, name: "Maestro", icon: "🔮" },
    { level: 75, name: "Monarca", icon: "👑" },
    { level: 100, name: "Leyenda del Alba", icon: "🌌" }
  ];

  function freshState() {
    return {
      version: VERSION,
      createdAt: Date.now(),
      updatedAt: Date.now(),
      profile: {
        name: "Cazador",
        title: "",
        startDate: "2026-10-05",
        bedtime: "23:00"
      },
      hero: {
        level: 1,
        xp: 0,
        totalXp: 0,
        gold: 0,
        crystals: 0,
        talentPoints: 0
      },
      days: {},
      rewards: {},
      training: {
        addedKg: 3,
        lastIncrease: null,
        history: []
      },
      records: {
        measures: [],
        photos: [],
        sessions: 0
      },
      game: {
        energy: 3,
        energyDay: "",
        chapter: 1,
        stage: 1,
        battle: null,
        inventory: [],
        equipment: { weapon: null, armor: null, charm: null },
        materials: {},
        talents: {},
        collection: {},
        achievements: {},
        milestones: {},
        unlockedStories: [],
        openedChests: 0
      },
      settings: {
        sound: true,
        reducedEffects: false
      },
      ui: { page: "today", subpage: {} }
    };
  }

  let storageAvailable = true;
  let loadWarning = "";

  function readState() {
    const base = freshState();
    let raw;

    try {
      raw = localStorage.getItem(KEY);
    } catch (error) {
      storageAvailable = false;
      loadWarning = "El navegador no permite guardar los datos.";
      return base;
    }

    if (!raw) return base;

    try {
      const saved = JSON.parse(raw);
      if (saved.version !== VERSION) {
        throw new Error("Versión de guardado incompatible.");
      }

      for (const key of [
        "profile", "hero", "training", "records",
        "game", "settings", "ui"
      ]) {
        base[key] = { ...base[key], ...(saved[key] || {}) };
      }

      base.days = saved.days || {};
      base.rewards = saved.rewards || {};
      base.createdAt = saved.createdAt || base.createdAt;
      return base;
    } catch (error) {
      loadWarning =
        "No se pudo leer la partida. No se sobrescribirá automáticamente.";
      storageAvailable = false;
      return base;
    }
  }

  let state = readState();
  const pages = new Map();
  const actions = new Map();
  const hooks = { save: [], day: [], reward: [] };
  let started = false;
  let toastTimeout;
  let audioContext = null;
  let restDeadline = 0;

  function today() {
    const key = dateKey();
    if (!state.days[key]) {
      state.days[key] = {
        tasks: {},
        training: {
          sets: [],
          exercises: {},
          completed: false,
          mode: "normal",
          addedKg: state.training.addedKg
        },
        notes: "",
        energy: null
      };
    }
    return state.days[key];
  }

  function plan(key = dateKey()) {
    return WEEK_PLAN[parseDate(key).getDay()];
  }

  function save() {
    state.updatedAt = Date.now();

    if (!storageAvailable) {
      toast("Guardado no disponible: exporta una copia antes de cerrar.");
      return false;
    }

    try {
      const previous = localStorage.getItem(KEY);
      if (previous) localStorage.setItem(BACKUP_KEY, previous);
      localStorage.setItem(KEY, JSON.stringify(state));
      return true;
    } catch (error) {
      storageAvailable = false;
      toast("No se pudo guardar. No cierres sin exportar tus datos.");
      return false;
    }
  }

  function xpNeeded(level = state.hero.level) {
    return Math.floor(180 + level * 45 + Math.pow(level, 1.35) * 18);
  }

  function rank() {
    return RANKS.filter(r => r.level <= state.hero.level).at(-1);
  }

  function sound(kind = "click") {
    if (!state.settings.sound) return;

    try {
      const Audio = window.AudioContext || window.webkitAudioContext;
      if (!Audio) return;
      if (!audioContext) audioContext = new Audio();
      if (audioContext.state === "suspended") audioContext.resume();

      const notes = {
        click: [420],
        reward: [520, 660],
        victory: [392, 494, 587, 784],
        level: [440, 554, 659, 880],
        hit: [150, 100],
        timer: [880, 880, 1175]
      }[kind] || [420];

      notes.forEach((frequency, index) => {
        const start = audioContext.currentTime + index * .11;
        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();

        oscillator.type = kind === "hit" ? "triangle" : "sine";
        oscillator.frequency.value = frequency;
        gain.gain.setValueAtTime(.04, start);
        gain.gain.exponentialRampToValueAtTime(.001, start + .22);

        oscillator.connect(gain);
        gain.connect(audioContext.destination);
        oscillator.start(start);
        oscillator.stop(start + .23);
      });
    } catch (error) {
      // El sonido nunca debe bloquear una acción.
    }
  }

  function toast(message) {
    $("toast").textContent = message;
    $("toast").classList.add("visible");
    clearTimeout(toastTimeout);
    toastTimeout = setTimeout(
      () => $("toast").classList.remove("visible"), 3300
    );
  }

  function modal(title, html) {
    $("modal-title").textContent = title;
    $("modal-body").innerHTML = html;
    const dialog = $("modal");

    if (!dialog.open) {
      if (typeof dialog.showModal === "function") dialog.showModal();
      else dialog.setAttribute("open", "");
    }
  }

  function closeModal() {
    const dialog = $("modal");
    if (typeof dialog.close === "function") dialog.close();
    else dialog.removeAttribute("open");
  }

  function reward(id, values = {}, label = "Recompensa") {
    if (state.rewards[id]) return false;

    state.rewards[id] = { at: Date.now(), values: clone(values) };

    const hero = state.hero;
    const xp = Math.max(0, Number(values.xp) || 0);
    const gold = Math.max(0, Number(values.gold) || 0);
    const crystals = Math.max(0, Number(values.crystals) || 0);

    hero.xp += xp;
    hero.totalXp += xp;
    hero.gold += gold;
    hero.crystals += crystals;

    if (values.energy) {
      state.game.energy = Math.min(
        8, state.game.energy + Math.max(0, Number(values.energy) || 0)
      );
    }

    let levels = 0;
    while (hero.xp >= xpNeeded(hero.level)) {
      hero.xp -= xpNeeded(hero.level);
      hero.level++;
      hero.talentPoints++;
      levels++;
    }

    hooks.reward.forEach(fn => fn(id, values));
    save();

    const items = [
      xp ? `+${xp} EXP` : "",
      gold ? `+${gold} oro` : "",
      crystals ? `+${crystals} cristales` : "",
      values.energy ? `+${values.energy} energía` : ""
    ].filter(Boolean);

    toast(`${label}: ${items.join(" · ") || "registrado"}`);
    sound(levels ? "level" : "reward");

    if (levels) {
      modal(
        "Has subido de nivel",
        `<div class="avatar" style="margin:0 auto 14px">${rank().icon}</div>
         <h2 style="text-align:center">Nivel ${hero.level}</h2>
         <p class="goldtext" style="text-align:center">${rank().name}</p>
         <p>Has ganado ${levels} punto(s) de talento.
         Tu progreso permanece aunque tengas un día difícil.</p>`
      );
    }

    return true;
  }

  function resetDailyEnergy() {
    const key = dateKey();
    if (state.game.energyDay === key) return;

    state.game.energyDay = key;
    state.game.energy = Math.min(8, Math.max(3, state.game.energy));

    today();
    hooks.day.forEach(fn => fn(key));
    save();
  }

  function registerPage(id, renderer) { pages.set(id, renderer); }
  function registerAction(id, handler) { actions.set(id, handler); }

  function go(page) {
    if (!pages.has(page)) {
      toast("Esta sección se añadirá en las próximas partes.");
      return;
    }

    state.ui.page = page;
    save();
    render();
    window.scrollTo({ top: 0, behavior: "auto" });
  }

  function progress(value, max, color = "") {
    const percent = max > 0
      ? Math.min(100, Math.max(0, value / max * 100)) : 0;

    return `<div class="progress">
      <div style="width:${percent}%;${color ? `background:${color}` : ""}">
      </div>
    </div>`;
  }

  function button(text, action, data = {}, classes = "") {
    const attrs = Object.entries(data).map(([key, value]) =>
      `data-${key}="${escape(value)}"`
    ).join(" ");

    return `<button class="${escape(classes)}"
      data-action="${escape(action)}" ${attrs}>${text}</button>`;
  }

  function renderHud() {
    const hero = state.hero;
    const currentRank = rank();

    $("hud").innerHTML = `
      <section class="card hero">
        <div class="row between wrap">
          <div class="row">
            <div class="avatar">${currentRank.icon}</div>
            <div>
              <h1>SYSTEM</h1>
              <div class="muted smalltext">Crónicas del Alba · v3</div>
              <strong>${escape(state.profile.name)}</strong>
              <div class="goldtext smalltext">
                ${escape(state.profile.title || currentRank.name)}
              </div>
            </div>
          </div>
          <div>
            <span class="badge">Nivel ${hero.level}</span>
            <span class="badge">⚡ ${state.game.energy}/8</span>
          </div>
        </div>
        <div class="divider"></div>
        <div class="row between smalltext">
          <span>Experiencia</span>
          <span>${hero.xp}/${xpNeeded()}</span>
        </div>
        ${progress(hero.xp, xpNeeded())}
        <div class="row wrap smalltext" style="margin-top:12px">
          <span class="currency">🪙 ${hero.gold.toLocaleString("es-ES")}</span>
          <span class="purpletext">💎 ${hero.crystals}</span>
          <span class="muted">🌟 ${hero.talentPoints} puntos de talento</span>
        </div>
      </section>`;
  }

  const NAV = [
    ["today", "🏕️", "Hoy"],
    ["routine", "📅", "Rutina"],
    ["adventure", "⚔️", "Aventura"],
    ["collection", "🎒", "Colección"],
    ["profile", "🌟", "Progreso"]
  ];

  function renderNav() {
    $("navigation").innerHTML = `<div class="nav-inner">
      ${NAV.map(([id, icon, name]) => `
        <button data-action="navigate" data-page="${id}"
          class="${state.ui.page === id ? "active" : ""}"
          aria-current="${state.ui.page === id ? "page" : "false"}">
          <span>${icon}</span>${name}
        </button>`).join("")}
    </div>`;
  }

  function render() {
    renderHud();
    renderNav();

    const renderer = pages.get(state.ui.page);
    try {
      $("screen").innerHTML = renderer
        ? renderer()
        : `<section class="card">
            <h2>La base está preparada</h2>
            <p>Faltan las partes 2, 3 y 4 para completar la app.</p>
           </section>`;
    } catch (error) {
      console.error(error);
      $("screen").innerHTML = `
        <section class="card">
          <h2>No se pudo mostrar esta sección</h2>
          <p class="redtext">${escape(error.message)}</p>
          <p>Tus datos no se han borrado. Puedes cambiar de pestaña.</p>
        </section>`;
    }
  }

  function rest(seconds = 120) {
    restDeadline = Date.now() + Math.max(1, seconds) * 1000;
    tickTimer();
  }

  function tickTimer() {
    const panel = $("floating-timer");
    if (!restDeadline) {
      panel.hidden = true;
      return;
    }

    const remaining = Math.ceil((restDeadline - Date.now()) / 1000);
    if (remaining <= 0) {
      restDeadline = 0;
      panel.hidden = true;
      sound("timer");
      toast("Descanso terminado. Reanuda cuando te notes preparado.");
      return;
    }

    panel.hidden = false;
    panel.textContent =
      `⏱️ ${Math.floor(remaining / 60)}:${String(remaining % 60).padStart(2, "0")}`;
  }

  function start() {
    if (started) return;
    started = true;

    resetDailyEnergy();

    document.addEventListener("click", event => {
      const target = event.target.closest("[data-action]");
      if (!target || target.disabled) return;

      const action = actions.get(target.dataset.action);
      if (!action) {
        toast("Esta acción todavía no está disponible.");
        return;
      }

      try {
        const result = action(target.dataset, target);
        if (result && typeof result.catch === "function") {
          result.catch(error => {
            console.error(error);
            toast("La acción no se pudo completar.");
          });
        }
      } catch (error) {
        console.error(error);
        toast(`No se pudo completar: ${error.message}`);
      }
    });

    $("modal-close").addEventListener("click", closeModal);

    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) {
        resetDailyEnergy();
        tickTimer();
        render();
      }
    });

    setInterval(tickTimer, 500);
    setInterval(() => {
      if (state.game.energyDay !== dateKey()) {
        resetDailyEnergy();
        render();
      }
    }, 30000);

    render();
    if (loadWarning) toast(loadWarning);
  }

  registerAction("navigate", data => go(data.page));
  registerAction("close-modal", closeModal);
  registerAction("start-rest", data => rest(Number(data.seconds) || 120));
  registerAction("stop-rest", () => {
    restDeadline = 0;
    tickTimer();
  });

  return {
    VERSION, KEY, BACKUP_KEY,
    $, escape, clone, dateKey, parseDate, shiftDate,
    dayDifference, weekKey, prettyDate,
    WEEK_PLAN, DAILY_SCHEDULE, RANKS,
    get state() { return state; },
    replaceState(next) { state = next; },
    today, plan, save, reward, xpNeeded, rank,
    sound, toast, modal, closeModal,
    registerPage, registerAction, hooks,
    go, progress, button, render,
    rest, start, freshState
  };
})();
</script>

<script>
"use strict";

(() => {
  const A = window.SYS;
  const E = A.escape;
  const B = A.button;

  /*
   * Las recompensas son por hábitos registrados.

   */
  const TASKS = [
    {
      id: "arrival",

      detail: "15:15–16:00. Desconectar sin convertirlo en otra tarea.",

      gold: 20
    },
    {
      id: "dev",

      id: "snack",

      detail: "17:30–18:30. Sesión prevista o recuperación si hace falta.",

    },
    {
      id: "shower",

      icon: "🚿",
      detail: "18:30–19:00. Termina el bloque físico y baja el ritmo.",
      xp: 20,
      gold: 15
    },
    {
      id: "piano",
      name: "Piano",
      icon: "🎹",
      detail: "19:00–19:45. Curso, pasaje difícil y una pieza por placer.",
      minutes: 45,
      shortMinutes: 15,
      xp: 60,
      gold: 40
    },
    {
      id: "dutch",
      name: "Neerlandés",
      icon: "🇳🇱",
      detail: "19:45–20:15. Duolingo, libro y unas frases propias.",
      minutes: 30,
      shortMinutes: 15,
      xp: 55,
      gold: 35
    },
    {
      id: "dinner",
      name: "Cena",
      icon: "🍽️",
      detail: "21:00–21:30. Tu horario fijo.",
      xp: 25,
      gold: 20
    },
    {
      id: "close",
      name: "Preparar mañana y desconectar",
      icon: "🌙",
      detail: "22:30–23:00. Mochila, higiene y cierre del día.",
      xp: 40,
      gold: 25
    }
  ];

  /*
   * Plantilla editable de calistenia.
   * No se añaden dominadas aquí: las lastradas están en martes/viernes.
   * El usuario puede sustituir estos nombres por su rutina habitual.
   */
  const CAL_DEFAULT = [
    { id: "cal1", name: "Bloque de empuje de tu rutina" },
    { id: "cal2", name: "Bloque de piernas de tu rutina" },
    { id: "cal3", name: "Bloque de core de tu rutina" }
  ];

  let focus = null;
  let focusInterval = null;

  function day(key = A.dateKey()) {
    if (!A.state.days[key]) {
      A.state.days[key] = {
        tasks: {},
        training: {
          sets: [],
          exercises: {},
          completed: false,
          mode: "normal",
          addedKg: A.state.training.addedKg
        },
        notes: "",
        energy: null
      };
    }

    const d = A.state.days[key];

    d.tasks ||= {};
    d.training ||= {};
    d.training.sets ||= [];
    d.training.exercises ||= {};
    d.training.mode ||= "normal";

    if (d.training.addedKg == null) {
      d.training.addedKg = A.state.training.addedKg;
    }

    return d;
  }

  function taskDone(id, key = A.dateKey()) {
    return !!A.state.days[key]?.tasks?.[id];
  }

  function completedCount(key = A.dateKey()) {
    return TASKS.filter(t => taskDone(t.id, key)).length;
  }

  function streak() {
    let key = A.dateKey();
    if (completedCount(key) < 5) key = A.shiftDate(key, -1);

    let count = 0;
    while (completedCount(key) >= 5 && count < 10000) {
      count++;
      key = A.shiftDate(key, -1);
    }
    return count;
  }

  function calExercises() {
    A.state.training.calExercises ||= A.clone(CAL_DEFAULT);
    return A.state.training.calExercises;
  }

  function currentTaskName(task) {
    if (task.id !== "physical") return task.name;
    return A.plan().name;
  }

  function completeTask(id, mode = "normal", minutes = null) {
    const task = TASKS.find(t => t.id === id);
    if (!task || taskDone(id)) return false;

    if (task.special === "training") {
      A.toast("Registra este bloque desde Entrenamiento.");
      return false;
    }

    const key = A.dateKey();
    day().tasks[id] = {
      at: Date.now(),
      mode,
      minutes
    };

    A.reward(
      `habit:${key}:${id}`,
      { xp: task.xp, gold: task.gold },
      currentTaskName(task)
    );

    checkDayBonus();
    A.save();
    A.render();
    return true;
  }

  function checkDayBonus() {
    const key = A.dateKey();
    const count = completedCount();

    if (count >= 5) {
      A.reward(
        `day:${key}:steady`,
        { xp: 70, crystals: 8, energy: 1 },
        "Día encaminado"
      );
    }

    if (count === TASKS.length) {
      A.reward(
        `day:${key}:complete`,
        { xp: 90, gold: 60, crystals: 8 },
        "Día completo"
      );
    }
  }

  function recentHistory() {
    return [...A.state.training.history]
      .sort((a, b) => b.date.localeCompare(a.date))
      .slice(0, 12);
  }

  function scheduledWeek() {
    const monday = A.weekKey();
    const letters = ["L", "M", "X", "J", "V", "S", "D"];

    return `<div class="grid seven">
      ${letters.map((letter, index) => {
        const key = A.shiftDate(monday, index);
        const p = A.plan(key);
        const completed = !!A.state.days[key]?.training?.completed;

        return `<div class="day
          ${key === A.dateKey() ? "today" : ""}
          ${completed ? "done" : ""}">
          ${letter}
          <span class="emoji">${completed ? "✅" : p.icon}</span>
        </div>`;
      }).join("")}
    </div>`;
  }

  function taskCard(task) {
    const done = taskDone(task.id);
    const record = day().tasks[task.id];

    let controls = "";

    if (done) {
      controls = `<span class="badge greentext">
        ${record?.mode === "short" ? "Versión breve ✓" :
          record?.mode === "recovery" ? "Recuperación ✓" : "Registrado ✓"}
      </span>`;
    } else if (task.special === "training") {
      controls = B(
        "Registrar",
        "routine-tab",
        { tab: "training" },
        "small"
      );
    } else if (task.minutes) {
      controls = B(
        "Abrir bloque",
        "open-focus",
        { task: task.id },
        "small"
      );
    } else {
      controls = B(
        "Hecho",
        "complete-habit",
        { task: task.id },
        "small"
      );
    }

    return `<div class="quest ${done ? "done" : ""}">
      <div class="icon">${task.icon}</div>
      <div class="grow">
        <strong class="quest-name">${E(currentTaskName(task))}</strong>
        <div class="smalltext muted">${E(task.detail)}</div>
        <span class="task-reward">+${task.xp} EXP · +${task.gold} oro</span>
      </div>
      ${controls}
    </div>`;
  }

  function renderToday() {
    const p = A.plan();
    const count = completedCount();
    const d = day();

    return `
      <section class="card">
        <div class="row between wrap">
          <div>
            <div class="muted smalltext">${E(A.prettyDate(A.dateKey()))}</div>
            <h2 style="margin-bottom:0">${p.icon} ${E(p.name)}</h2>
          </div>
          <span class="badge">🔥 ${streak()} días de constancia</span>
        </div>

        <div class="divider"></div>

        <div class="row between smalltext">
          <span>Hábitos registrados</span>
          <strong>${count}/${TASKS.length}</strong>
        </div>
        ${A.progress(count, TASKS.length)}

        <p class="muted smalltext" style="margin-top:10px">
          Cinco hábitos mantienen la racha.
          Las versiones breves cuentan igual.
          Un día incompleto no borra tu personaje ni tus objetos.
        </p>
      </section>

      <section class="card">
        <h3>Tu semana</h3>
        ${scheduledWeek()}
      </section>

      ${focus ? focusPanel() : ""}

      <section class="card reward">
        <h3>Recompensas del día</h3>
        <div class="grid two">
          <div class="stat">
            <strong>${count >= 5 ? "✅" : `${count}/5`}</strong>
            <span class="smalltext">Día encaminado</span>
            <div class="muted smalltext">
              70 EXP · 8 cristales · 1 energía
            </div>
          </div>
          <div class="stat">
            <strong>${count === TASKS.length ? "✅" : `${count}/${TASKS.length}`}</strong>

            <div class="muted smalltext">
              90 EXP · 60 oro · 8 cristales
            </div>
          </div>
        </div>
      </section>

      <section class="card">
        <h3>Misiones de tu rutina</h3>
        <div class="stack">${TASKS.map(taskCard).join("")}</div>
      </section>

      <section class="card">
        <h3>Objetivo concreto de programación</h3>
        <label for="dev-goal">

        </label>
        <input id="dev-goal" maxlength="180"
          value="${E(d.devGoal || "")}"
          placeholder="Mi tarea de hoy">
        <div style="margin-top:10px">
          ${B("Guardar objetivo", "save-dev-goal", {}, "small")}
        </div>
      </section>

      <section class="card">
        <h3>Tu resumen de hoy</h3>
        <textarea id="daily-notes" rows="3"

  function routineTab() {
    return A.state.ui.subpage.routine || "schedule";
  }

  function routineTabs() {
    const tab = routineTab();

    return `<div class="tabs">

        ["history", "📈 Historial"]
      ].map(([id, name]) =>
        B(name, "routine-tab", { tab: id }, tab === id ? "active" : "")
      ).join("")}
    </div>`;
  }

  function renderRoutine() {
    const views = {
      schedule: schedulePanel,
      training: trainingPanel,
      focus: blocksPanel,
      history: historyPanel
    };

    return routineTabs() + (views[routineTab()] || schedulePanel)();
  }

  function minutesOf(time) {
    const [hours, minutes] = time.split(":").map(Number);
    return hours * 60 + minutes;
  }

  function schedulePanel() {
    const p = A.plan();
    const weekday = A.parseDate(A.dateKey()).getDay();
    const weekend = weekday === 0 || weekday === 6;
    const now = new Date();
    const minute = now.getHours() * 60 + now.getMinutes();

    /*
     * El fin de semana conserva el orden de la tarde.
     * No se inventan clases de sábado o domingo.
     */
    const rows = A.DAILY_SCHEDULE.filter(row =>
      !weekend || minutesOf(row[0]) >= minutesOf("15:15")
    );

    return `
      <section class="card">
        <h2>Horario fijo</h2>
        <p class="muted smalltext">
          ${weekend
            ? "Fin de semana: mañana libre; se conserva la estructura de tarde."

        <div class="timeline">

            const name = start === "17:30"
              ? p.type === "rest"
                ? "Descanso: sin entrenamiento obligatorio"
                : p.name
              : originalName;

            const active =
              minute >= minutesOf(start) && minute < minutesOf(end);

            return `<div class="${active ? "schedule-active" : ""}"

              ].map(([index, name]) =>
                `<tr><td>${name}</td><td>${A.WEEK_PLAN[index].name}</td></tr>`

  function trainingPanel() {
    const d = day();
    const p = A.plan();
    const training = d.training;

    let body;

    if (training.completed) {
      body = `
        <div class="empty">

          Registrar el descanso concede la misma recompensa del bloque físico.
        </p>
        ${B("Registrar descanso", "finish-training",
          { mode: "recovery" }, "full primary")}`;

      body = `
        ${p.type === "pull" ? pullupPanel() : calisthenicsPanel()}

        ${B("Registrar sesión completa", "finish-training",
          { mode: "normal" }, "full gold")}

          ${B("Sesión adaptada", "finish-training",
            { mode: "short" }, "small")}
          ${B("Hoy necesito recuperar", "finish-training",
            { mode: "recovery" }, "small")}
        </div>

        <p class="muted smalltext" style="margin-top:10px">
          Las tres formas conceden la misma recompensa.
          El modo adaptado registra lo que realmente hayas hecho,
          sin obligarte a completar series pendientes.
        </p>`;
    }

    return `
      <section class="card">
        <div class="row between wrap">
          <h2 style="margin-bottom:0">${p.icon} ${E(p.name)}</h2>
          <span class="badge">17:30–18:30</span>
        </div>
        <p class="muted smalltext" style="margin-top:10px">
          Una recompensa al día. Ni la carga ni las repeticiones
          multiplican el botín.
        </p>
        ${body}
      </section>

      ${p.type === "pull" ? progressionPanel() : ""}

      <section class="card">
        <h3>Temporizador de descanso</h3>
        <div class="row wrap">
          ${B("2 minutos", "start-rest", { seconds: 120 })}
          ${B("3 minutos", "start-rest", { seconds: 180 })}
          ${B("Cerrar timer", "stop-rest", {}, "ghost")}
        </div>
        <p class="muted smalltext" style="margin-top:10px">

  }

  function pullupPanel() {
    const training = day().training;
    const kg = training.addedKg;

    return `
      <p class="goldtext" style="margin-top:16px">
        Mochila: ${kg} kg · referencia: 4 series de 10
      </p>

      <p class="muted smalltext">
        Registra tus repeticiones reales.
        Un 10–10–8–7 también es un registro válido:
        no hace falta inventar las que faltan.
      </p>

      ${[0, 1, 2, 3].map(index => {
        const record = training.sets[index];
        const done = record != null;

        return `<div class="training-set ${done ? "done" : ""}">
          <strong>S${index + 1}</strong>
          ${done
            ? `<span class="greentext">${record.reps} repeticiones ✓</span>`
            : `<input id="pull-reps-${index}" type="number"
                min="1" max="50" step="1" value="10"
                aria-label="Repeticiones de la serie ${index + 1}">`}
          ${done
            ? `<span class="badge">${record.kg} kg</span>`
            : B("Guardar", "save-pull-set", { index }, "small")}
        </div>`;
      }).join("")}

      <div class="training-check" style="margin-top:12px">
        <input id="training-clean" type="checkbox"
          ${training.clean ? "checked" : ""}>
        <label for="training-clean">
          Las series han sido controladas, sin molestias,
          y habría podido hacer alguna repetición más.
        </label>
      </div>`;
  }

  function calisthenicsPanel() {
    const training = day().training;

    return `
      <p class="muted smalltext" style="margin-top:16px">
        Usa estos tres bloques para tu calistenia habitual.
        Puedes cambiar sus nombres; la app no añade otra sesión
        de dominadas con peso.
      </p>

      ${calExercises().map(exercise => {
        const done = !!training.exercises[exercise.id];

        return `<div class="quest ${done ? "done" : ""}"
                     style="margin-bottom:8px">
          <div class="icon">${done ? "✅" : "🤸"}</div>
          <div class="grow">
            <strong class="quest-name">${E(exercise.name)}</strong>
          </div>
          ${done
            ? `<span class="badge">Registrado</span>`
            : B("Hecho", "save-cal-block",
                { exercise: exercise.id }, "small")}
        </div>`;
      }).join("")}

      <details style="margin-top:12px">
        <summary>Editar nombres de mi rutina</summary>
        <div class="stack" style="margin-top:10px">
          ${calExercises().map(exercise => `
            <label>
              Nombre del bloque
              <input id="cal-name-${exercise.id}"
                value="${E(exercise.name)}" maxlength="100">
            </label>
          `).join("")}
          ${B("Guardar rutina", "save-cal-template", {}, "small")}
        </div>
      </details>`;
  }

  function progressionStatus() {
    const training = A.state.training;
    const kg = training.addedKg;

    if (kg >= 5) {
      return { ready: false, message: "Has llegado al objetivo inicial de 5 kg." };
    }

    const firstWeightedSession = training.history.find(h =>
      h.type === "pull" && h.mode !== "recovery"
    );

    const anchor = training.lastIncrease || firstWeightedSession?.date;

    if (!anchor) {
      return {
        ready: false,
        message: "El plazo comienza cuando registres tu primera sesión de dominadas."
      };
    }

    const elapsed = A.dayDifference(anchor, A.dateKey());

    const qualifying = training.history.some(h =>
      h.date >= anchor &&
      h.type === "pull" &&
      h.mode === "normal" &&
      h.kg === kg &&
      h.clean === true &&
      h.reps.length === 4 &&
      h.reps.every(reps => reps >= 10)
    );

    if (elapsed < 14) {
      return {
        ready: false,
        message: `Faltan ${14 - elapsed} días para revisar la siguiente subida.`
      };
    }

    if (!qualifying) {
      return {
        ready: false,
        message: `Falta registrar una sesión controlada de 4×10 con ${kg} kg.`
      };
    }

    return {
      ready: true,
      message: `Puedes revisar el paso de ${kg} a ${kg + 1} kg.
      No es una subida obligatoria.`
    };
  }

  function progressionPanel() {
    const status = progressionStatus();
    const kg = A.state.training.addedKg;

    return `
      <section class="card">
        <h3>Progresión de mochila</h3>
        <div class="grid three">
          ${[3, 4, 5].map(value => `
            <div class="stat">
              <strong class="${kg >= value ? "goldtext" : "muted"}">
                ${value} kg
              </strong>
              <span class="smalltext">
                ${kg === value ? "Actual" : kg > value ? "Superado" : "Pendiente"}
              </span>
            </div>`).join("")}
        </div>
        <p class="muted smalltext" style="margin-top:12px">
          ${E(status.message)}
        </p>
        ${status.ready
          ? B("Revisar subida de 1 kg", "increase-load", {}, "gold full")
          : ""}
      </section>`;
  }

  function finishTraining(mode) {
    const d = day();
    const p = A.plan();
    const training = d.training;

    if (training.completed) {
      A.toast("El bloque físico ya está registrado.");
      return;
    }

    if (!["normal", "short", "recovery"].includes(mode)) return;

    if (mode === "normal" && p.type === "pull") {
      if ([0, 1, 2, 3].some(index => !training.sets[index])) {
        A.toast("Faltan series. Guarda las reales o registra una sesión adaptada.");
        return;
      }

      training.clean = !!A.$("training-clean")?.checked;
    }

    if (mode === "normal" && p.type === "cal") {
      if (!calExercises().every(ex => training.exercises[ex.id])) {
        A.toast("Faltan bloques. Puedes registrar una sesión adaptada.");
        return;
      }
    }

    training.completed = true;
    training.mode = p.type === "rest" ? "recovery" : mode;
    training.finishedAt = Date.now();

    const key = A.dateKey();

    d.tasks.physical = {
      at: Date.now(),
      mode: training.mode
    };

    const record = {
      date: key,
      type: p.type,
      mode: training.mode,
      kg: training.addedKg,
      reps: training.sets.filter(Boolean).map(set => set.reps),
      clean: training.clean === true,
      exercises: Object.keys(training.exercises)
    };

    if (!A.state.training.history.some(h => h.date === key)) {
      A.state.training.history.push(record);
    }

    if (training.mode !== "recovery") {
      A.state.records.sessions++;
    }

    A.reward(
      `habit:${key}:physical`,
      { xp: 85, gold: 60, energy: 1 },
      training.mode === "recovery"
        ? "Recuperación registrada"
        : "Sesión registrada"
    );

    checkDayBonus();
    A.save();
    A.render();
  }

  function blocksPanel() {
    return `
      ${focus ? focusPanel() : ""}
      <section class="card">
        <h2>Bloques de concentración</h2>
        <p class="muted smalltext">
          El timer organiza el bloque; no mide tu valor.
          Puedes registrar trabajo hecho sin esperar a que termine.
          La versión breve recibe la misma recompensa.
        </p>
        <div class="stack">
          ${TASKS.filter(t => t.minutes).map(taskCard).join("")}
        </div>
      </section>`;
  }

  function focusPanel() {
    if (!focus) return "";

    const task = TASKS.find(t => t.id === focus.task);
    const minutes = Math.floor(focus.remaining / 60);
    const seconds = String(focus.remaining % 60).padStart(2, "0");

    return `
      <section class="card hero">
        <h3 class="focus-title">${task.icon} ${E(task.name)}</h3>
        <div id="focus-clock" class="focus-clock">${minutes}:${seconds}</div>

        <p id="focus-status" class="muted smalltext" style="text-align:center">
          ${focus.remaining === 0
            ? "Bloque terminado. Registra lo que hayas hecho."
            : focus.running ? "Bloque en marcha" : "En pausa"}
        </p>

        <div class="row wrap" style="justify-content:center">
          ${B(focus.running ? "Pausar" : "Continuar",
              "toggle-focus", {}, "small")}
          ${B("Registrar trabajo hecho",
              "finish-focus", {}, "small gold")}
          ${B("Cerrar sin registrar",
              "cancel-focus", {}, "small ghost")}
        </div>
      </section>`;
  }

  function focusRemaining() {
    if (!focus) return 0;
    if (!focus.running) return focus.remaining;
    return Math.max(0, Math.ceil((focus.deadline - Date.now()) / 1000));
  }

  function tickFocus() {
    if (!focus) return;

    focus.remaining = focusRemaining();

    const clock = A.$("focus-clock");
    if (clock) {
      clock.textContent =
        `${Math.floor(focus.remaining / 60)}:${String(focus.remaining % 60).padStart(2, "0")}`;
    }

    if (focus.running && focus.remaining === 0) {
      focus.running = false;
      A.sound("timer");
      A.toast("Bloque terminado. Guarda tu avance.");
      A.render();
    }
  }

  function startFocus(taskId, mode) {
    const task = TASKS.find(t => t.id === taskId);
    if (!task?.minutes || taskDone(taskId)) return;

    if (focus && focus.task !== taskId) {
      A.toast("Cierra o termina el bloque que ya está abierto.");
      return;
    }

    const minutes = mode === "short"
      ? task.shortMinutes : task.minutes;

    focus = {
      task: taskId,
      date: A.dateKey(),
      mode,
      duration: minutes * 60,
      remaining: minutes * 60,
      deadline: Date.now() + minutes * 60000,
      running: true
    };

    clearInterval(focusInterval);
    focusInterval = setInterval(tickFocus, 500);

    A.closeModal();
    A.state.ui.page = "routine";
    A.state.ui.subpage.routine = "focus";
    A.save();
    A.render();
  }

  function openFocus(taskId) {
    const task = TASKS.find(t => t.id === taskId);
    if (!task || taskDone(taskId)) return;

    A.modal(
      `${task.icon} ${task.name}`,
      `<p>${E(task.detail)}</p>
       <div class="stack">
         ${B(`Iniciar ${task.minutes} minutos`,
             "start-focus", { task: taskId, mode: "normal" }, "primary")}
         ${B(`Versión breve: ${task.shortMinutes} minutos`,
             "start-focus", { task: taskId, mode: "short" })}
         ${B("Ya lo he hecho: registrar",
             "manual-focus", { task: taskId }, "gold")}
       </div>
       <p class="muted smalltext" style="margin-top:12px">
         No hay bonus por alargar el tiempo.
       </p>`
    );
  }

  function cancelFocus() {
    clearInterval(focusInterval);
    focusInterval = null;
    focus = null;
    A.render();
  }

  function historyPanel() {
    const history = recentHistory();

    return `
      <section class="card">
        <h2>Progreso real</h2>
        <div class="grid three">
          <div class="stat">
            <strong>${A.state.records.sessions}</strong>
            <span class="smalltext">Sesiones registradas</span>
          </div>
          <div class="stat">
            <strong>${A.state.training.addedKg} kg</strong>
            <span class="smalltext">Carga actual</span>
          </div>
          <div class="stat">
            <strong>${streak()}</strong>
            <span class="smalltext">Racha actual</span>
          </div>
        </div>
      </section>

      <section class="card">
        <h3>Últimos bloques físicos</h3>
        ${history.length
          ? `<div class="stack">${history.map(record => `
              <div class="stat">
                <strong style="font-size:15px">
                  ${E(A.prettyDate(record.date))}
                </strong>
                <div class="smalltext">
                  ${E(A.WEEK_PLAN[A.parseDate(record.date).getDay()].name)}
                  · ${record.mode === "recovery"
                    ? "Recuperación"
                    : record.mode === "short" ? "Adaptada" : "Completa"}
                </div>
                ${record.type === "pull" && record.reps.length
                  ? `<div class="goldtext smalltext">
                      ${record.kg} kg · ${record.reps.join(" / ")}
                    </div>`
                  : ""}
              </div>`).join("")}</div>`
          : `<div class="empty">Aquí aparecerá tu primera sesión.</div>`}
      </section>`;
  }

  /*
   * Acciones.
   */
  A.registerAction("routine-tab", data => {
    A.state.ui.page = "routine";
    A.state.ui.subpage.routine = data.tab;
    A.save();
    A.render();
  });

  A.registerAction("complete-habit", data => completeTask(data.task));

  A.registerAction("save-dev-goal", () => {
    day().devGoal = A.$("dev-goal").value.trim();
    A.save();
    A.toast("Objetivo de programación guardado.");
  });

  A.registerAction("save-day-notes", () => {
    day().notes = A.$("daily-notes").value;
    A.save();
    A.toast("Nota guardada.");
  });

  A.registerAction("save-pull-set", data => {
    const index = Number(data.index);

    if (!Number.isInteger(index) || index < 0 || index > 3) return;
    if (A.plan().type !== "pull") return;

    const training = day().training;
    if (training.completed || training.sets[index]) return;

    const reps = Number(A.$(`pull-reps-${index}`).value);
    if (!Number.isInteger(reps) || reps < 1 || reps > 50) {
      A.toast("Introduce tus repeticiones reales entre 1 y 50.");
      return;
    }

    training.sets[index] = {
      reps,
      kg: training.addedKg,
      at: Date.now()
    };

    training.clean = !!A.$("training-clean")?.checked;

    A.save();
    A.sound("click");

    if (index < 3) A.rest(120);
    A.render();
  });

  A.registerAction("save-cal-block", data => {
    if (A.plan().type !== "cal" || day().training.completed) return;
    if (!calExercises().some(ex => ex.id === data.exercise)) return;

    day().training.exercises[data.exercise] = true;
    A.save();
    A.sound("click");
    A.render();
  });

  A.registerAction("save-cal-template", () => {
    A.state.training.calExercises = calExercises().map(exercise => ({
      id: exercise.id,
      name: A.$(`cal-name-${exercise.id}`).value.trim() || exercise.name
    }));

    A.save();
    A.toast("Nombres de tu rutina actualizados.");
    A.render();
  });

  A.registerAction("finish-training", data => finishTraining(data.mode));

  A.registerAction("increase-load", () => {
    const status = progressionStatus();
    if (!status.ready) return;

    A.modal(
      "Revisar la carga",
      `<p>La app ha comprobado el plazo y los registros,
       pero no puede comprobar tu técnica ni tu recuperación.</p>
       <p>Confirma la subida solo si estás cómodo con la carga actual,
       sin molestias y sin necesidad de forzar.</p>
       ${B("Confirmar +1 kg", "confirm-load", {}, "gold full")}`
    );
  });

  A.registerAction("confirm-load", () => {
    if (!progressionStatus().ready) return;

    A.state.training.addedKg++;
    A.state.training.lastIncrease = A.dateKey();

    /*
     * No cambia el peso de una sesión empezada.
     */
    const training = day().training;
    if (!training.sets.some(Boolean) && !training.completed) {
      training.addedKg = A.state.training.addedKg;
    }

    A.save();
    A.closeModal();
    A.toast(`Carga de las próximas sesiones: ${A.state.training.addedKg} kg.`);
    A.render();
  });

  A.registerAction("open-focus", data => openFocus(data.task));

  A.registerAction("start-focus", data =>
    startFocus(data.task, data.mode)
  );

  A.registerAction("manual-focus", data => {
    A.closeModal();
    completeTask(data.task, "manual");
  });

  A.registerAction("toggle-focus", () => {
    if (!focus) return;

    if (focus.running) {
      focus.remaining = focusRemaining();
      focus.running = false;
    } else {
      if (focus.remaining <= 0) {
        A.toast("El bloque ya terminó. Registra tu avance.");
        return;
      }

      focus.deadline = Date.now() + focus.remaining * 1000;
      focus.running = true;
    }

    A.render();
  });

  A.registerAction("finish-focus", () => {
    if (!focus) return;

    if (focus.date !== A.dateKey()) {
      A.toast("Este bloque pertenece a otro día. Ciérralo y abre uno nuevo.");
      return;
    }

    const remaining = focusRemaining();
    const elapsedMinutes =
      Math.max(0, Math.round((focus.duration - remaining) / 60));

    const task = focus.task;
    const mode = focus.mode;

    clearInterval(focusInterval);
    focusInterval = null;
    focus = null;

    completeTask(task, mode, elapsedMinutes);
  });

  A.registerAction("cancel-focus", cancelFocus);

  A.hooks.day.push(() => {
    /*
     * Un bloque de ayer no completa automáticamente una misión de hoy.
     */
    if (focus && focus.date !== A.dateKey()) cancelFocus();
  });

  A.registerPage("today", renderToday);
  A.registerPage("routine", renderRoutine);

  /*
   * API utilizada por las partes 3 y 4.
   */
  A.life = {
    TASKS,
    day,
    taskDone,
    completedCount,
    streak,
    progressionStatus,
    completeTask
  };
})();
</script>

    },
    {

      materialName: "Fragmento del Umbral",
      materialIcon: "🔮",
      text: "El viaje termina donde empezó la grieta. La luz necesita un guardián.",
      enemies: [

        ["watcher", "👁️", "Observador del Umbral"],

  };

  const SLOT_NAMES = {
    weapon: "Arma",

  };

  const ITEMS = {};
  const weaponNames = [
    "Espada del Alba", "Pico del Custodio", "Filo del Eco",

  const armorNames = [

  const charmNames = [

    "Ascua Eterna", "Estrella Congelada", "Ojo del Umbral"
